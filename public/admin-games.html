<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EarnHub – গেম সেটিং</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@600;800&display=swap">
<style>
:root{--bg:#0a0b1e;--bg2:#12143a;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--tx:#eef0ff;--mut:#9aa0cf;--cy:#2de2e6;--gd:#ffc93c;--ok:#4be38a;--rd:#ff6b8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:radial-gradient(800px 460px at 90% -10%,#1a3a8e44,transparent),var(--bg);color:var(--tx);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.5;min-height:100vh;padding-bottom:96px}
h1,h2,h3{font-family:Sora,"Hind Siliguri",sans-serif;margin:0}
.app{max-width:720px;margin:0 auto;padding:0 14px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.btn{border:0;cursor:pointer;font:600 14px "Hind Siliguri",sans-serif;color:#06112a;padding:8px 16px;border-radius:10px;background:linear-gradient(180deg,#6ff3f5,var(--cy));box-shadow:0 3px 0 #138a90;text-decoration:none;display:inline-block}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #138a90}
.btn.ok{background:linear-gradient(180deg,#8ff0b4,var(--ok));box-shadow:0 3px 0 #1a9a52}
.btn.rd{background:linear-gradient(180deg,#ff9bb0,var(--rd));box-shadow:0 3px 0 #a3283f;color:#2a0510}
.btn.gh{background:var(--card);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input[type=text],input[type=number]{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#0a0c2e;color:var(--tx);font:15px "Hind Siliguri",sans-serif}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0 0;cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--cy)}
.im{background:#0a0c2e;border:1px dashed var(--line);border-radius:12px;padding:8px;text-align:center}
.im img{display:block;width:100%;max-height:130px;object-fit:cover;border-radius:8px;margin-bottom:8px}
.im .ph{height:80px;display:grid;place-items:center;color:var(--mut);font-size:13px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ok);color:#04230f;padding:9px 20px;border-radius:99px;font-weight:600;display:none;z-index:30;max-width:92%;text-align:center}
.toast.er{background:var(--rd);color:#2a0510}
#bar{position:fixed;left:0;right:0;bottom:0;background:#0d0f2bf2;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:25}
#bar .in{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
#bar .btn{padding:11px 22px;font-size:16px}
</style>
</head>
<body>
<div class="app">
  <header><h2>🎮 গেম সেটিং</h2><a class="btn gh" href="/admin">← অ্যাডমিন</a></header>
  <div id="view"><div class="mut">লোড হচ্ছে...</div></div>
</div>
<div id="bar"><div class="in"><span class="mut">ছবি বসালে সাথে সাথে সেভ হয়। বাকি সেটিং সেভ করতে বাটন চাপুন।</span><button class="btn ok" id="sv">💾 সেভ করুন</button></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var G=null,IM={};
var NM={memory:'🧠 মেমোরি ম্যাচ',quiz:'❓ কুইজ রাশ',coin:'🪙 কয়েন ক্যাচার',tap:'⚡ ট্যাপ রাশ'};
var KIND={cover:'বাইরের ছবি (লবির কার্ডে, ১৬:৯ ভালো)',hero:'ভেতরের ছবি (গেমের পেজের উপরে, চওড়া ভালো)'};
function toast(m,bad){var t=$('#toast');t.textContent=m;t.className='toast'+(bad?' er':'');t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2600)}
async function api(p,b){
  var r=await fetch(p,{method:b!==undefined?'POST':'GET',headers:{'Content-Type':'application/json'},body:b!==undefined?JSON.stringify(b):undefined,credentials:'same-origin'});
  var d={};try{d=await r.json()}catch(e){}
  if(r.status===401){toast('অ্যাডমিন লগইন শেষ। আবার ঢুকুন।',true);setTimeout(function(){location.href='/'},1500);throw new Error('login')}
  if(!r.ok||d.ok===false)throw new Error(d.msg||('সমস্যা হয়েছে ('+r.status+')'));
  return d;
}
function slot(g,k){
  var v=(IM[g]||{})[k];
  return '<div><label>'+KIND[k]+'</label><div class="im">'+(v?'<img src="/api/game/img/'+g+'/'+k+'?v='+v+'" alt="">':'<div class="ph">ছবি নেই</div>')+'<label class="btn" style="margin:0;cursor:pointer">ছবি বাছুন<input type="file" accept="image/*" data-g="'+g+'" data-k="'+k+'" hidden></label>'+(v?' <button class="btn rd" data-del="'+g+'|'+k+'">মুছুন</button>':'')+'</div></div>';
}
function render(){
  var h='<div class="card"><label class="sw"><input type="checkbox" id="gon"'+(G.on?' checked':'')+'> গেম টুর্নামেন্ট চালু</label><div class="grid"><div><label>প্রতি গেমে দিনে কতবার খেলা যাবে</label><input type="number" id="gat" value="'+G.attempts+'"></div><div><label>পুরস্কারের জন্য সপ্তাহে ন্যূনতম খেলা</label><input type="number" id="gmp" value="'+G.minPlays+'"></div></div><label>পুরস্কার (রেড ডায়মন্ড), ১ম থেকে, কমা দিয়ে লিখুন</label><input type="text" id="gpr" value="'+G.prizes.join(', ')+'"><div class="mut" style="margin-top:6px">এই পুরস্কার প্রতি সপ্তাহে প্রতিটা গেমের সেরা খেলোয়াড়দের নিজে নিজে যোগ হয়। মোট খরচ = সবগুলোর যোগফল × চালু গেমের সংখ্যা।</div></div>';
  Object.keys(NM).forEach(function(g){
    h+='<div class="card"><div class="row"><b style="font-size:17px">'+NM[g]+'</b><label class="sw" style="margin:0"><input type="checkbox" data-gon="'+g+'"'+(G.games[g]!==false?' checked':'')+'> চালু</label></div><div class="grid" style="margin-top:6px">'+slot(g,'cover')+slot(g,'hero')+'</div></div>';
  });
  $('#view').innerHTML=h;
}
async function load(){var d=await api('/api/admin/games');G=d.cfg;IM=d.images;render()}
function resize(file,maxW){
  return new Promise(function(ok,no){
    var r=new FileReader();
    r.onerror=no;
    r.onload=function(){var im=new Image();im.onerror=no;im.onload=function(){
      var s=Math.min(1,maxW/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      var q=.8,d=c.toDataURL('image/jpeg',q);
      while(d.length>150000&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}
      d.length>180000?no(new Error('ছবি অনেক বড়, ছোট ছবি দিন')):ok(d);
    };im.src=r.result};
    r.readAsDataURL(file);
  });
}
document.addEventListener('change',async function(e){
  var t=e.target;
  if(t.dataset.k&&t.files&&t.files[0]){
    try{
      var d=await resize(t.files[0],t.dataset.k==='cover'?640:800);
      await api('/api/admin/game-image',{game:t.dataset.g,kind:t.dataset.k,data:d});
      toast('ছবি সেভ হয়েছে');await load();
    }catch(x){if(x.message!=='login')toast(x.message,true)}
  }
});
document.addEventListener('click',async function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.del){var p=b.dataset.del.split('|');
    try{await api('/api/admin/game-image-del',{game:p[0],kind:p[1]});toast('মুছে গেছে');await load()}catch(x){if(x.message!=='login')toast(x.message,true)}}
});
$('#sv').onclick=async function(){
  var b=this;b.disabled=true;
  try{
    var gm={};document.querySelectorAll('[data-gon]').forEach(function(c){gm[c.dataset.gon]=c.checked});
    var pr=$('#gpr').value.split(',').map(function(x){return x.trim()}).filter(function(x){return x!==''}).map(Number);
    await api('/api/admin/games-config',{cfg:{on:$('#gon').checked,attempts:Number($('#gat').value),minPlays:Number($('#gmp').value),prizes:pr,games:gm}});
    toast('সেভ হয়েছে');await load();
  }catch(x){if(x.message!=='login')toast(x.message,true)}
  b.disabled=false;
};
load().catch(function(x){if(x.message!=='login')$('#view').innerHTML='<div class="card mut">'+x.message+'</div>'});
})();
</script>
</body>
  </html>
