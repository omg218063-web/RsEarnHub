<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EarnHub – অ্যাডমিন প্যানেল</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@600;800&display=swap">
<style>
:root{--bg:#0a0b1e;--bg2:#12143a;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--tx:#eef0ff;--mut:#9aa0cf;--cy:#2de2e6;--mg:#ff3d9a;--gd:#ffc93c;--ok:#4be38a;--rd:#ff6b8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:radial-gradient(800px 460px at 90% -10%,#1a3a8e44,transparent),var(--bg);color:var(--tx);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.5;min-height:100vh;padding-bottom:90px}
h1,h2,h3{font-family:Sora,"Hind Siliguri",sans-serif;margin:0}
.app{max-width:760px;margin:0 auto;padding:0 14px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0 8px}
.logo{font:800 20px Sora,sans-serif}.logo b{color:var(--cy)}
.nav{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);background:linear-gradient(var(--bg) 80%,transparent);z-index:5;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mut);font:600 15px "Hind Siliguri",sans-serif;padding:8px 14px;border-radius:12px;cursor:pointer;white-space:nowrap}
.nav button.on{background:linear-gradient(180deg,#6ff3f5,var(--cy));color:#06112a;border-color:transparent;box-shadow:0 3px 0 #138a90}
.btn{border:0;cursor:pointer;font:600 14px "Hind Siliguri",sans-serif;color:#06112a;padding:7px 14px;border-radius:10px;background:linear-gradient(180deg,#6ff3f5,var(--cy));box-shadow:0 3px 0 #138a90;text-decoration:none;display:inline-block}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #138a90}
.btn.ok{background:linear-gradient(180deg,#8ff0b4,var(--ok));box-shadow:0 3px 0 #1a9a52}
.btn.rd{background:linear-gradient(180deg,#ff9bb0,var(--rd));box-shadow:0 3px 0 #a3283f;color:#2a0510}
.btn.gh{background:var(--card);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
h3.sec{font-size:17px;margin:18px 0 10px}
.stat{background:linear-gradient(160deg,var(--bg2),#0d0f2b);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 5px 0 #0005}
.stat b{display:block;font:800 22px Sora,sans-serif;color:var(--cy)}
.stat span{font-size:13px;color:var(--mut)}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input[type=text],input[type=number],input[type=url],select,textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#0a0c2e;color:var(--tx);font:15px "Hind Siliguri",sans-serif}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--tx);margin:10px 0 0;cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--cy)}
.badge{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pend{background:#ffc93c22;color:var(--gd)}.done{background:#4be38a22;color:var(--ok)}.bad{background:#ff6b8a22;color:var(--rd)}.run{background:#2de2e622;color:var(--cy)}
.s1{background:#2de2e622;color:var(--cy)}.s2{background:#ff3d9a22;color:var(--mg)}
.sub{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.sub button{flex:none;border:0;background:var(--card);color:var(--mut);font:600 14px "Hind Siliguri",sans-serif;padding:7px 13px;border-radius:99px;cursor:pointer}
.sub button.on{background:var(--tx);color:#0a0b1e}
.sw2{width:100%;height:46px;border-radius:10px;display:flex;align-items:center;padding:0 12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#04230f;padding:9px 20px;border-radius:99px;font-weight:600;display:none;z-index:30;max-width:92%;text-align:center}
.toast.er{background:var(--rd);color:#2a0510}
#savebar{position:fixed;left:0;right:0;bottom:0;background:#0d0f2bf2;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:none;z-index:25}
#savebar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
#savebar .btn{padding:11px 22px;font-size:16px}
.msg{white-space:pre-wrap;word-break:break-word;margin:6px 0}
@media(max-width:520px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">Earn<b>Hub</b> অ্যাডমিন</div><a class="btn gh" href="/">সাইটে যান</a></header>
<div class="nav" id="nav"></div>
<main id="view"></main>
</div>
<div id="savebar"><div class="in"><span class="mut" id="sbt"></span><button class="btn ok" id="sbb">💾 সেভ করুন</button></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var V=$('#view');
var CF=null,dirty=0,tab='dash',ftab='tk',usite='',ostat='',uq='',loading=false;
var GN=['নীল','কমলা','বেগুনি','সবুজ'],GR=['linear-gradient(135deg,#1a7a96,#16206a)','linear-gradient(135deg,#e8501c,#a31d5c)','linear-gradient(135deg,#6a2cc9,#2b1a7a)','linear-gradient(135deg,#0f8a5a,#164a6a)'];
var NAV=[['dash','📊 ড্যাশবোর্ড'],['usr','👥 ইউজার'],['ord','🛒 SMM অর্ডার'],['msg','💬 মেসেজ'],['free','💰 Free Income'],['ban','📣 ব্যানার ও প্রমোশন'],['smm','🧾 SMM সার্ভিস'],['set','⚙️ সেটিংস']];
var CFG_TABS={free:1,ban:1,smm:1,set:1};

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function fm(n){return Number(n||0).toFixed(2).replace(/\.?0+$/,'')}
function dt(d){return new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function toast(m,bad){var t=$('#toast');t.textContent=m;t.className='toast'+(bad?' er':'');t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2400)}
async function api(p,b){
  var r=await fetch(p,{method:b!==undefined?'POST':'GET',headers:{'Content-Type':'application/json'},body:b!==undefined?JSON.stringify(b):undefined,credentials:'same-origin'});
  var d={};try{d=await r.json()}catch(e){}
  if(r.status===401){toast('অ্যাডমিন লগইন শেষ। আবার ঢুকুন।',true);setTimeout(function(){location.href='/'},1500);throw new Error('login')}
  if(!r.ok||d.ok===false)throw new Error(d.msg||('সমস্যা হয়েছে ('+r.status+')'));
  return d;
}
function g(p){return p.split('.').reduce(function(o,k){return o[k]},CF)}
function st(p,v){var a=p.split('.'),l=a.pop();a.reduce(function(o,k){return o[k]},CF)[l]=v}
function f(p,lb,ty){return '<div><label>'+lb+'</label><input data-p="'+p+'" type="'+(ty||'text')+'"'+(ty==='number'?' step="any"':'')+' value="'+esc(g(p))+'"></div>'}
function sel(p,lb,o){var v=g(p);return '<div><label>'+lb+'</label><select data-p="'+p+'" data-n="1">'+o.map(function(x){return '<option value="'+x[0]+'"'+(String(x[0])===String(v)?' selected':'')+'>'+esc(x[1])+'</option>'}).join('')+'</select></div>'}
function tg(p,lb){return '<label class="sw"><input type="checkbox" data-p="'+p+'" data-b="1"'+(g(p)!==false?' checked':'')+'> '+lb+'</label>'}
function site(s){return '<span class="badge '+(s==='smm'?'s1':'s2')+'">'+(s==='smm'?'SMM Panel':'Free Income')+'</span>'}
function sub(items,cur,key){return '<div class="sub">'+items.map(function(i){return '<button data-'+key+'="'+i[0]+'" class="'+(i[0]===cur?'on':'')+'">'+i[1]+'</button>'}).join('')+'</div>'}
function setDirty(){dirty++;$('#savebar').style.display='block';$('#sbt').textContent='সেভ না করা পরিবর্তন আছে'}
function clearDirty(){dirty=0;$('#savebar').style.display='none'}
function money(site,n){return (site==='smm'?'$':'৳')+fm(n)}

/* ---------- ড্যাশবোর্ড ---------- */
async function dash(){
  V.innerHTML='<div class="mut">লোড হচ্ছে...</div>';
  var d=await api('/api/admin/overview');
  V.innerHTML='<div class="grid g4"><div class="stat"><b>'+d.users.total+'</b><span>মোট ইউজার</span></div><div class="stat"><b>'+d.users.smm+'</b><span>SMM Panel</span></div><div class="stat"><b>'+d.users.free+'</b><span>Free Income</span></div><div class="stat"><b>'+d.users.today+'</b><span>আজ নতুন</span></div></div>'+
    '<h3 class="sec">SMM অর্ডার</h3><div class="grid g3"><div class="stat"><b style="color:var(--gd)">'+d.orders.pending+'</b><span>Pending</span></div><div class="stat"><b>'+d.orders.processing+'</b><span>Processing</span></div><div class="stat"><b style="color:var(--ok)">'+d.orders.completed+'</b><span>Completed</span></div></div>'+
    '<h3 class="sec">মেসেজ</h3><div class="grid"><div class="stat"><b>'+d.messages.support+'</b><span>কাস্টমার কেয়ার</span></div><div class="stat"><b>'+d.messages.custom+'</b><span>কাস্টম অর্ডার</span></div></div>'+
    '<div class="card" style="margin-top:12px"><span class="mut">ডিপোজিট ও উইথড্র আপনার ই ওয়ালেটে যায়, এখানে নয়। এই প্যানেলে ইউজার দেখা ও সব কনটেন্ট এডিট করা হয়।</span></div>'+
    '<h3 class="sec">সাম্প্রতিক ইউজার</h3>'+(d.recent.length?d.recent.map(function(u){return '<div class="card row"><div><b>'+esc(u.username)+'</b><div class="mut">'+dt(u.createdAt)+'</div></div>'+site(u.site)+'</div>'}).join(''):'<div class="card mut">কোনো ইউজার নেই</div>');
}

/* ---------- ইউজার ---------- */
async function users(){
  V.innerHTML='<input type="text" id="uq" placeholder="নাম বা ফোন দিয়ে খুঁজুন" value="'+esc(uq)+'" style="margin-bottom:10px">'+sub([['','সব'],['smm','SMM Panel'],['free','Free Income']],usite,'us')+'<div id="ul"><div class="mut">লোড হচ্ছে...</div></div>';
  var t;$('#uq').oninput=function(){uq=this.value;clearTimeout(t);t=setTimeout(loadUsers,350)};
  loadUsers();
}
async function loadUsers(){
  var e=$('#ul');if(!e)return;
  try{
    var d=await api('/api/admin/users?q='+encodeURIComponent(uq)+'&site='+usite);
    if(!CF)CF=(await api('/api/admin/config')).cfg;
    e.innerHTML=d.items.length?d.items.map(function(u){
      return '<div class="card"><div class="row"><div><b>'+esc(u.username)+'</b>'+(u.banned?' <span class="badge bad">Banned</span>':'')+'<div class="mut">'+esc(u.phone||'')+' · '+dt(u.createdAt)+'</div></div>'+site(u.site)+'</div>'+
        '<div class="grid g3" style="margin-top:8px"><div class="stat" style="padding:10px"><b style="font-size:17px">'+money(u.site,u.balance)+'</b><span>ব্যালেন্স</span></div>'+
        (u.site==='free'?'<div class="stat" style="padding:10px"><b style="font-size:17px">৳'+fm(u.earn)+'</b><span>মোট আয়</span></div><div class="stat" style="padding:10px"><b style="font-size:17px">'+esc((CF.pk[u.pkg]||CF.pk[0]).n)+'</b><span>প্যাকেজ</span></div>':'')+'</div>'+
        '<div class="grid" style="margin-top:6px"><div><label>ব্যালেন্স যোগ (+) বা কাটুন (−)</label><input type="number" step="any" id="am'+u.id+'" placeholder="যেমন 50 বা -20"></div><div><label>কারণ (নোট)</label><input type="text" id="nt'+u.id+'" placeholder="ঐচ্ছিক"></div></div>'+
        '<div class="row" style="margin-top:8px"><button class="btn" data-adj="'+u.id+'">ব্যালেন্স বদলান</button>'+(u.site==='free'?'<select data-pkg="'+u.id+'" style="width:auto">'+CF.pk.map(function(p,i){return '<option value="'+i+'"'+(i===u.pkg?' selected':'')+'>'+esc(p.n)+'</option>'}).join('')+'</select>':'')+'<button class="btn '+(u.banned?'ok':'rd')+'" data-ban="'+u.id+'" data-v="'+(u.banned?'unban':'ban')+'">'+(u.banned?'আনব্যান':'ব্যান করুন')+'</button></div></div>';
    }).join(''):'<div class="card mut">কোনো ইউজার পাওয়া যায়নি।</div>';
  }catch(x){if(x.message!=='login')e.innerHTML='<div class="card mut">'+esc(x.message)+'</div>'}
}

/* ---------- SMM অর্ডার ---------- */
var STS=['Pending','Processing','Completed','Cancelled'];
function stCls(s){return s==='Completed'?'done':(s==='Processing'?'run':(s==='Cancelled'?'bad':'pend'))}
async function orders(){
  V.innerHTML=sub([['','সব']].concat(STS.map(function(s){return [s,s]})),ostat,'os')+'<div id="ol"><div class="mut">লোড হচ্ছে...</div></div>';
  var d=await api('/api/admin/orders?status='+ostat);
  $('#ol').innerHTML=d.items.length?d.items.map(function(o){
    var locked=o.status==='Completed'||o.status==='Cancelled';
    return '<div class="card"><div class="row"><b>'+esc(o.pf)+' '+esc(o.sv)+'</b><span class="badge '+stCls(o.status)+'">'+esc(o.status)+'</span></div><div class="mut">👤 '+esc(o.username)+' · '+o.qty+' টি · $'+fm(o.cost)+' · '+dt(o.createdAt)+'</div><div class="mut" style="word-break:break-all">'+esc(o.link)+'</div>'+
      (locked?'':'<div class="row" style="margin-top:8px"><select data-ost="'+o.id+'" style="width:auto">'+STS.map(function(s){return '<option'+(s===o.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select><span class="mut">Cancelled করলে টাকা ফেরত যায়</span></div>')+'</div>';
  }).join(''):'<div class="card mut">কোনো অর্ডার নেই।</div>';
}

/* ---------- মেসেজ ---------- */
async function msgs(){
  V.innerHTML='<div class="mut">লোড হচ্ছে...</div>';
  var d=await api('/api/admin/messages');
  V.innerHTML='<h3 class="sec" style="margin-top:0">কাস্টমার কেয়ার ('+d.support.length+')</h3>'+(d.support.length?d.support.map(function(m){return '<div class="card"><div class="row"><b>👤 '+esc(m.username)+'</b><span class="mut">'+dt(m.createdAt)+'</span></div><div class="msg">'+esc(m.message)+'</div><button class="btn rd" data-md="support" data-id="'+m.id+'">মুছুন</button></div>'}).join(''):'<div class="card mut">কোনো মেসেজ নেই।</div>')+
    '<h3 class="sec">কাস্টম অর্ডারের রিকোয়েস্ট ('+d.custom.length+')</h3>'+(d.custom.length?d.custom.map(function(m){return '<div class="card"><div class="row"><b>👤 '+esc(m.username)+'</b><span class="mut">'+dt(m.createdAt)+'</span></div><div class="msg">'+esc(m.text)+'</div><div class="mut" style="word-break:break-all">'+esc(m.link)+' · বাজেট $'+fm(m.budget)+'</div><button class="btn rd" data-md="custom" data-id="'+m.id+'" style="margin-top:6px">মুছুন</button></div>'}).join(''):'<div class="card mut">কোনো রিকোয়েস্ট নেই।</div>');
}

/* ---------- Free Income সেটিং ---------- */
function free(){
  var h=sub([['tk','টাস্ক'],['pk','প্যাকেজ'],['bn','বোনাস'],['sp','স্পিন'],['rf','রেফারেল']],ftab,'ft');
  if(ftab==='tk'){
    h+='<div class="row" style="margin-bottom:8px"><span class="mut">টাস্ক মুছা যায় না, বন্ধ করে রাখুন (চালু থাকা টাস্কই ইউজার দেখে)।</span><button class="btn" data-add="tk">+ নতুন টাস্ক</button></div>';
    CF.tk.forEach(function(t,i){h+='<div class="card"><div class="grid">'+sel('tk.'+i+'.t','ধরন',[['ad','Ad Earning'],['vid','Video Earning']])+f('tk.'+i+'.n','নাম')+'</div>'+f('tk.'+i+'.l','অফিসিয়াল লিংক','url')+tg('tk.'+i+'.on','চালু')+'</div>'});
  }
  if(ftab==='pk'){
    h+='<div class="mut" style="margin-bottom:8px">প্রতি টাস্কের রিওয়ার্ড ও দৈনিক লিমিট এখান থেকে ঠিক হয়।</div>';
    CF.pk.forEach(function(p,i){h+='<div class="card"><div class="grid">'+f('pk.'+i+'.n','নাম')+f('pk.'+i+'.pr','দাম (৳)','number')+'</div><div class="grid" style="margin-top:4px">'+f('pk.'+i+'.lim','দৈনিক টাস্ক','number')+f('pk.'+i+'.rw','প্রতি টাস্ক (৳)','number')+'</div></div>'});
  }
  if(ftab==='bn'){
    CF.bn.forEach(function(b,i){h+='<div class="card"><b>'+esc(b.n)+'</b><div class="grid">'+f('bn.'+i+'.v','পরিমাণ (৳)','number')+f('bn.'+i+'.h','কত ঘণ্টা পরপর নেওয়া যাবে','number')+'</div></div>'});
    h+='<div class="card">'+sel('vipMin','VIP বোনাসের জন্য ন্যূনতম প্যাকেজ',CF.pk.map(function(p,i){return [i,p.n]}))+'</div>';
  }
  if(ftab==='sp'){
    h+='<div class="mut" style="margin-bottom:8px">১৬ ঘরের পুরস্কার (৳) ও জেতার সম্ভাবনা। সম্ভাবনা যত বেশি, ঘরটা তত বেশি আসবে।</div><div class="grid g4">';
    CF.wv.forEach(function(v,i){h+='<div class="card" style="padding:10px;margin:0"><div class="mut">ঘর '+(i+1)+'</div>'+f('wv.'+i,'পুরস্কার ৳','number')+f('ww.'+i,'সম্ভাবনা','number')+'</div>'});
    h+='</div>';
  }
  if(ftab==='rf')h+='<div class="card"><div class="grid">'+f('ref.su','রেফারেল বোনাস (৳), বন্ধুর প্রথম ডিপোজিটে','number')+f('ref.pct','আজীবন কমিশন (%)','number')+'</div></div>';
  V.innerHTML=h;
}

/* ---------- ব্যানার ও প্রমোশন ---------- */
function ban(){
  var h='<div class="row"><h3 class="sec" style="margin:0">থিম ব্যানার (হোমের উপরে)</h3><button class="btn" data-add="bnr">+ নতুন</button></div><br>';
  CF.bnr.forEach(function(b,i){h+='<div class="card"><div class="sw2" style="background:'+GR[b.c%4]+'">'+esc(b.t)+'</div><div class="grid">'+f('bnr.'+i+'.t','কোম্পানির নাম')+f('bnr.'+i+'.d','লেখা')+'</div>'+sel('bnr.'+i+'.c','রঙ',GN.map(function(n,j){return [j,n]}))+'<div class="row">'+tg('bnr.'+i+'.on','চালু')+'<button class="btn rd" data-del="bnr.'+i+'">মুছুন</button></div></div>'});
  h+='<div class="row"><h3 class="sec" style="margin-bottom:0">প্রমোশন (ইউজাররা কাজ করে রিওয়ার্ড পাবে)</h3><button class="btn" data-add="pr">+ নতুন</button></div><div class="mut" style="margin:6px 0 10px">প্রমোশন মুছা যায় না, বন্ধ করে রাখুন।</div>';
  CF.pr.forEach(function(p,i){h+='<div class="card"><div class="grid">'+f('pr.'+i+'.n','কোম্পানি')+f('pr.'+i+'.rw','রিওয়ার্ড (৳)','number')+'</div>'+f('pr.'+i+'.d','বিবরণ')+f('pr.'+i+'.l','লিংক','url')+sel('pr.'+i+'.c','রঙ',GN.map(function(n,j){return [j,n]}))+tg('pr.'+i+'.on','চালু')+'</div>'});
  V.innerHTML=h;
}

/* ---------- SMM সার্ভিস ---------- */
function smm(){
  var h='<div class="card">'+f('rate','১ ডলার = কত টাকা','number')+'</div><div class="row"><h3 class="sec" style="margin:0">সার্ভিস ও দাম (১০০০-এ, ডলারে)</h3><button class="btn" data-add="smm">+ নতুন</button></div><br>';
  CF.smm.forEach(function(s,i){h+='<div class="card"><div class="grid g3">'+f('smm.'+i+'.pf','প্ল্যাটফর্ম')+f('smm.'+i+'.sv','সার্ভিস')+f('smm.'+i+'.p','দাম ($)','number')+'</div><div class="row">'+tg('smm.'+i+'.on','চালু')+'<button class="btn rd" data-del="smm.'+i+'">মুছুন</button></div></div>'});
  V.innerHTML=h;
}

/* ---------- সেটিংস ---------- */
function setT(){
  V.innerHTML='<div class="card">'+f('set.name','সাইটের নাম')+'</div><div class="card"><b>পেমেন্ট তথ্য (ইউজার সাইটে দেখানো হবে)</b><div class="grid">'+f('set.bk','bKash নাম্বার')+f('set.ng','Nagad নাম্বার')+f('set.mindep','সর্বনিম্ন ডিপোজিট (৳, Free Income)','number')+f('set.minwd','সর্বনিম্ন উইথড্র (৳)','number')+'</div></div><div class="card mut">এই নাম্বারগুলো ইউজারদের শুধু দেখানোর জন্য। টাকা আসে আপনার ই ওয়ালেটে।</div>';
}

var ADD={tk:{t:'ad',n:'নতুন টাস্ক',l:'https://',on:true},bnr:{t:'নতুন কোম্পানি',d:'অফার লিখুন',c:0,on:true},pr:{n:'নতুন কোম্পানি',d:'বিবরণ',l:'https://',rw:5,c:0,on:true},smm:{pf:'নতুন',sv:'সার্ভিস',p:1,on:true}};
async function render(){
  $('#nav').innerHTML=NAV.map(function(n){return '<button data-tab="'+n[0]+'" class="'+(n[0]===tab?'on':'')+'">'+n[1]+'</button>'}).join('');
  try{
    if(CFG_TABS[tab]&&!CF){V.innerHTML='<div class="mut">লোড হচ্ছে...</div>';CF=(await api('/api/admin/config')).cfg}
    ({dash:dash,usr:users,ord:orders,msg:msgs,free:free,ban:ban,smm:smm,set:setT})[tab]();
  }catch(e){if(e.message!=='login')V.innerHTML='<div class="card mut">'+esc(e.message)+'</div>'}
}

document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.p){var v=t.dataset.b?t.checked:(t.type==='number'?(t.value===''?'':Number(t.value)):(t.dataset.n?Number(t.value):t.value));st(t.dataset.p,v);setDirty();return}
  if(t.dataset.pkg){api('/api/admin/user',{id:t.dataset.pkg,action:'pkg',pkg:Number(t.value)}).then(function(){toast('প্যাকেজ বদলেছে')}).catch(function(x){toast(x.message,true)});return}
  if(t.dataset.ost){api('/api/admin/order',{id:t.dataset.ost,status:t.value}).then(function(r){toast(r.refunded?'বাতিল হয়েছে, $'+fm(r.refunded)+' ফেরত গেছে':'অবস্থা বদলেছে');orders()}).catch(function(x){toast(x.message,true);orders()});return}
});
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;var d=t.dataset;
  if(d.tab){tab=d.tab;render();window.scrollTo(0,0);return}
  if(d.ft){ftab=d.ft;free();return}
  if(d.us!==undefined){usite=d.us;users();return}
  if(d.os!==undefined){ostat=d.os;orders();return}
  if(d.add){CF[d.add].push(JSON.parse(JSON.stringify(ADD[d.add])));setDirty();render();return}
  if(d.del){var a=d.del.split('.');CF[a[0]].splice(Number(a[1]),1);setDirty();render();return}
  if(d.adj){var am=$('#am'+d.adj).value,nt=$('#nt'+d.adj).value;
    api('/api/admin/user',{id:d.adj,action:'adjust',amount:Number(am),note:nt}).then(function(r){toast('ব্যালেন্স বদলেছে, এখন '+fm(r.balance));loadUsers()}).catch(function(x){toast(x.message,true)});return}
  if(d.ban){if(!confirm(d.v==='ban'?'এই ইউজারকে ব্যান করবেন?':'আনব্যান করবেন?'))return;
    api('/api/admin/user',{id:d.ban,action:d.v}).then(function(){toast('হয়েছে');loadUsers()}).catch(function(x){toast(x.message,true)});return}
  if(d.md){if(!confirm('মুছে ফেলবেন?'))return;api('/api/admin/message/delete',{kind:d.md,id:d.id}).then(function(){msgs()}).catch(function(x){toast(x.message,true)});return}
});
$('#sbb').onclick=async function(){
  var b=this;b.disabled=true;
  try{await api('/api/admin/config',{cfg:CF});clearDirty();toast('সেভ হয়েছে, সাইটে নতুন সেটিং চালু');CF=(await api('/api/admin/config')).cfg;render()}
  catch(e){if(e.message!=='login')toast(e.message,true)}
  b.disabled=false;
};
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue=''}});
render();
})();
</script>
</body>
</html>
