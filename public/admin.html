.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
h3.sec{font-size:17px;margin:18px 0 10px}
.stat{background:linear-gradient(160deg,var(--bg2),#0d0f2b);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 5px 0 #0005}

.stat span{font-size:13px;color:var(--mut)}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}

.demo{background:#ffc93c18;border:1px solid #ffc93c55;color:var(--gd);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:10px}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
