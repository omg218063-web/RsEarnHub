<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EarnHub – SMM Panel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@600;800&display=swap">
<style>
:root{--bg:#0a0b1e;--bg2:#12143a;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--tx:#eef0ff;--mut:#9aa0cf;--cy:#2de2e6;--mg:#ff3d9a;--gd:#ffc93c;--ok:#4be38a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:radial-gradient(800px 460px at 85% -10%,#3a1a6e55,transparent),var(--bg);color:var(--tx);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.55;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:Sora,"Hind Siliguri",sans-serif;margin:0}
.app{max-width:560px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.logo{font:800 20px Sora,sans-serif}.logo b{color:var(--cy)}
.hr{display:flex;gap:8px;align-items:center;position:relative}
.bal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font:700 15px Sora,sans-serif;color:var(--gd)}
.dots{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:22px;cursor:pointer}
.menu{position:absolute;right:0;top:48px;background:#181b4a;border:1px solid var(--line);border-radius:14px;min-width:190px;padding:6px;z-index:15;box-shadow:0 14px 30px #000a;display:none}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);font:500 16px "Hind Siliguri",sans-serif;padding:10px 12px;border-radius:10px;cursor:pointer}
.menu button:hover{background:var(--card)}
.btn{border:0;cursor:pointer;font:600 16px "Hind Siliguri",sans-serif;color:#06112a;padding:12px 22px;border-radius:14px;background:linear-gradient(180deg,#6ff3f5,var(--cy));box-shadow:0 5px 0 #138a90,0 10px 20px #2de2e633;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #138a90}
.btn.mg{color:#fff;background:linear-gradient(180deg,#ff72b8,var(--mg));box-shadow:0 5px 0 #a3185f}
.btn.mg:active{box-shadow:0 1px 0 #a3185f}
.btn.sm{padding:6px 14px;font-size:14px;border-radius:10px;box-shadow:0 3px 0 #138a90}
.full{width:100%}
:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.banner{border-radius:22px;padding:20px;margin:6px 0 18px;background:linear-gradient(135deg,#3b1c8f,#c2268a);box-shadow:0 10px 0 #0005,0 18px 36px #0006}
.banner h2{font-size:22px;margin-bottom:4px}.banner p{margin:0 0 12px;opacity:.9}
h3.sec{font-size:18px;margin:18px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pf{border:1px solid var(--line);border-radius:20px;padding:16px 12px;background:linear-gradient(160deg,var(--bg2),#0d0f2b);color:var(--tx);cursor:pointer;text-align:center;font:600 16px "Hind Siliguri",sans-serif;box-shadow:0 7px 0 #0005;transition:transform .15s}
.pf:hover{transform:translateY(-3px) rotateX(6deg)}
.pf small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.ic{width:54px;height:54px;border-radius:16px;margin:0 auto 8px;display:grid;place-items:center;font:800 24px Sora,sans-serif;color:#fff;box-shadow:inset 0 -4px 0 #0004,0 6px 16px #0005}
.yt{background:#e62117}.tt{background:#111;box-shadow:inset 0 -4px 0 #0004,-3px 0 0 #25f4ee,3px 0 0 #fe2c55}.ig{background:linear-gradient(45deg,#f9a03c,#e1306c,#7b3fe4)}.fb{background:#1877f2}.tg{background:#229ed9}.xx{background:#000;border:1px solid #fff4}.sc{background:#fffc00;color:#111}.pn{background:#e60023}.li{background:#0a66c2;font-size:20px}.tw{background:#9146ff}.sp{background:#1db954}.th{background:#101010;border:1px solid #fff4}.wa{background:#25d366}.menu .mi{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;margin-right:10px;background:var(--card);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{color:var(--gd);font-weight:700}
.mut{color:var(--mut);font-size:14px}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0a0c2e;color:var(--tx);font:16px "Hind Siliguri",sans-serif}
.tot{font:800 22px Sora,sans-serif;color:var(--cy)}
.err{color:#ff8aa8;font-size:14px;min-height:20px;margin:6px 0}
.badge{padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.pend{background:#ffc93c22;color:var(--gd)}.done{background:#4be38a22;color:var(--ok)}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.pay button{border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:14px;padding:12px;font:600 16px "Hind Siliguri",sans-serif;cursor:pointer}
.pay button.on{border-color:var(--cy);box-shadow:0 0 18px #2de2e655}
.num{font:700 20px Sora,sans-serif;letter-spacing:1px;color:var(--gd)}
nav.tab{position:fixed;left:0;right:0;bottom:0;background:#0d0f2bee;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tab div{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
nav.tab button{background:none;border:0;color:var(--mut);font:500 11.5px "Hind Siliguri",sans-serif;padding:10px 0;cursor:pointer}
nav.tab button span{display:block;font-size:22px}
nav.tab button.on{color:var(--cy)}
.ms{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}.pav{width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--card);display:grid;place-items:center;font-size:28px;border:2px solid var(--cy);flex:none}.mini{background:#0003;border-radius:12px;padding:8px 4px;text-align:center}.mini b{display:block;font:800 18px Sora,sans-serif}.mini span{font-size:12px}.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 10px var(--ok);animation:pl 1.4s infinite}@keyframes pl{50%{opacity:.3}}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ok);color:#04230f;padding:10px 20px;border-radius:99px;font-weight:600;display:none;z-index:30}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Earn<b>Hub</b> <span class="mut" style="font:500 13px 'Hind Siliguri'">SMM</span></div>
    <div class="hr">
      <div class="bal" id="bal">$0.00</div>
      <button class="dots" id="dots" aria-label="মেনু">⋮</button>
      <div class="menu" id="menu"><div class="ms" id="msum"></div>
        <button data-go="orders"><span class="mi">📋</span>আমার অর্ডার</button>
        <button data-go="account"><span class="mi">💳</span>ডিপোজিট হিস্টোরি</button>
        <button data-go="support"><span class="mi">🎧</span>কাস্টমার কেয়ার</button>
        <button data-go="custom"><span class="mi">✏️</span>কাস্টম অর্ডার</button>
      </div>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="tab"><div>
  <button data-go="home" class="on"><span>🏠</span>হোম</button>
  <button data-go="new"><span>🛒</span>নতুন অর্ডার</button>
  <button data-go="orders"><span>📋</span>অর্ডার</button>
  <button data-go="account"><span>👤</span>অ্যাকাউন্ট</button>
  <button data-go="support"><span>🎧</span>কাস্টমার কেয়ার</button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
(function(){
var RATE=125,NUM={bKash:'01XXX-XXXXXX',Nagad:'01YYY-YYYYYY'};
var PF={YouTube:{c:'yt',t:'▶',s:[['Subscribers',4.5],['Views',1.2],['Likes',2]]},
TikTok:{c:'tt',t:'♪',s:[['Followers',2.8],['Likes',0.9],['Views',0.15]]},
Instagram:{c:'ig',t:'◎',s:[['Followers',3.2],['Likes',1.1],['Views',0.2]]},
Facebook:{c:'fb',t:'f',s:[['Page Followers',2.5],['Post Likes',1.5],['Page Likes',2.2]]},
'Telegram':{c:'tg',t:'✈',s:[['Channel Members',2.2],['Post Views',0.3],['Reactions',0.8]]},
'Twitter / X':{c:'xx',t:'X',s:[['Followers',4],['Likes',2.4],['Retweets',2.8]]},
'Snapchat':{c:'sc',t:'S',s:[['Followers',3.5],['Story Views',0.9]]},
'Pinterest':{c:'pn',t:'P',s:[['Followers',3],['Saves',1.8]]},
'LinkedIn':{c:'li',t:'in',s:[['Followers',6],['Post Likes',3]]},
'Twitch':{c:'tw',t:'T',s:[['Followers',5],['Live Viewers',4.5]]},
'Spotify':{c:'sp',t:'♫',s:[['Plays',1.2],['Followers',3.8]]},
'Threads':{c:'th',t:'@',s:[['Followers',3.4],['Likes',1.6]]},
'WhatsApp':{c:'wa',t:'✆',s:[['Channel Followers',3.2],['Reactions',1.1]]}};
var $=function(s){return document.querySelector(s)};
function ld(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var S={bal:ld('smm_bal',5),orders:ld('smm_orders',[]),deps:ld('smm_deps',[]),photo:ld('smm_photo','')};
function persist(){sv('smm_bal',S.bal);sv('smm_orders',S.orders);sv('smm_deps',S.deps);sv('smm_photo',S.photo)}
function money(n){return '$'+n.toFixed(2)}
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2200)}
function head(){$('#bal').textContent=money(S.bal)}
var sel={p:'YouTube',s:0},pm='bKash';

function home(){
 var h='<div class="banner"><h2>সোশ্যাল গ্রোথ, ডলার রেটে</h2><p>নতুন ইউজারের জন্য $5 ডেমো ব্যালেন্স যোগ করা আছে।</p><button class="btn mg" data-go="new">অর্ডার করুন</button></div><h3 class="sec">প্ল্যাটফর্ম বেছে নিন</h3><div class="grid">';
 Object.keys(PF).forEach(function(k){var p=PF[k],mn=Math.min.apply(null,p.s.map(function(x){return x[1]}));
  h+='<button class="pf" data-pf="'+k+'"><div class="ic '+p.c+'">'+p.t+'</div>'+k+'<small>১০০০-এ $'+mn+' থেকে</small></button>'});
 h+='</div><h3 class="sec">কাস্টম অর্ডার</h3><div class="card row"><div><b>নিজের মতো অর্ডার</b><div class="mut">লিংক, পরিমাণ ও নোট দিন, আমরা দাম জানাব।</div></div><button class="btn sm" data-go="custom">দিন</button></div>';
 return h}

function neworder(){
 var p=PF[sel.p],s=p.s[sel.s];
 var h='<h3 class="sec">নতুন অর্ডার</h3><div class="card"><label>প্ল্যাটফর্ম</label><select id="op">';
 Object.keys(PF).forEach(function(k){h+='<option'+(k===sel.p?' selected':'')+'>'+k+'</option>'});
 h+='</select><label>সার্ভিস</label><select id="os">';
 p.s.forEach(function(x,i){h+='<option value="'+i+'"'+(i===sel.s?' selected':'')+'>'+x[0]+' ($'+x[1]+' / ১০০০)</option>'});
 h+='</select><label>লিংক</label><input id="ol" placeholder="https://..."><label>পরিমাণ (সর্বনিম্ন ১০০)</label><input id="oq" type="number" inputmode="numeric" value="1000" min="100">';
 h+='<div class="row" style="margin-top:14px"><span class="mut">মোট দাম</span><span class="tot" id="ot">'+money(s[1])+'</span></div><div class="err" id="oe"></div><button class="btn full" id="ob">অর্ডার দিন</button></div>';
 return h}
function calc(){var q=+$('#oq').value||0;$('#ot').textContent=money(q/1000*PF[sel.p].s[sel.s][1])}

function custom(){return '<h3 class="sec">কাস্টম অর্ডার</h3><div class="card"><label>কী লাগবে?</label><input id="cn" placeholder="যেমন: ৫০০ কমেন্ট, ভিডিও লিংকসহ"><label>লিংক</label><input id="cl" placeholder="https://..."><label>আপনার বাজেট ($)</label><input id="cb" type="number" inputmode="decimal"><div class="err" id="ce"></div><button class="btn full" id="cs">রিকোয়েস্ট পাঠান</button></div>'}

function orders(){
 var h='<h3 class="sec">আমার অর্ডার</h3>';
 if(!S.orders.length)return h+'<div class="card mut">এখনো কোনো অর্ডার নেই। প্রথম অর্ডার দিতে "নতুন অর্ডার" চাপুন।</div>';
 S.orders.slice().reverse().forEach(function(o){h+='<div class="card"><div class="row"><b>#'+o.id+' '+o.pf+' '+o.sv+'</b><span class="badge '+(o.st==='Completed'?'done':'pend')+'">'+o.st+'</span></div><div class="mut" style="word-break:break-all">'+o.link+'</div><div class="row"><span>'+o.q+' টি</span><span class="price">'+money(o.cost)+'</span></div></div>'});
 return h}

function account(){
 var h=prof()+'<div class="card"><div class="mut">বর্তমান ব্যালেন্স</div><div class="tot">'+money(S.bal)+'</div></div><h3 class="sec">ফান্ড যোগ করুন</h3><div class="card"><label>পরিমাণ (ডলার)</label><input id="da" type="number" inputmode="decimal" value="1" min="1"><div class="row" style="margin-top:8px"><span class="mut">১ ডলার = ৳'+RATE+'</span><b id="dt" class="price">৳'+RATE+'</b></div><label>পেমেন্ট মাধ্যম</label><div class="pay"><button data-pm="bKash" class="'+(pm==='bKash'?'on':'')+'">bKash</button><button data-pm="Nagad" class="'+(pm==='Nagad'?'on':'')+'">Nagad</button></div><div class="mut">এই নাম্বারে Send Money করুন:</div><div class="num">'+NUM[pm]+'</div><label>Transaction ID</label><input id="dx" placeholder="যেমন: 8N7A6D5E4C"><div class="err" id="de"></div><button class="btn full" id="db">ডিপোজিট সাবমিট</button></div><h3 class="sec">ডিপোজিট হিস্টোরি</h3>';
 if(!S.deps.length)h+='<div class="card mut">কোনো ডিপোজিট নেই।</div>';
 S.deps.slice().reverse().forEach(function(d){var ok=d.st==='Approved';h+='<div class="card"><div class="row"><b>'+money(d.usd)+' (৳'+d.bdt+')</b><span class="badge '+(ok?'done':'pend')+'">'+d.st+'</span></div><div class="mut">'+d.m+' · '+d.trx+'</div>'+(ok?'':'<button class="btn sm" style="margin-top:8px" data-ap="'+d.id+'">ডেমো: অ্যাডমিন অ্যাপ্রুভ</button>')+'</div>'});
 return h}

function support(){return '<h3 class="sec">কাস্টমার কেয়ার</h3><div class="card"><b>আমরা সাহায্য করতে প্রস্তুত</b><p class="mut">অর্ডার, ডিপোজিট বা অন্য সমস্যায় লিখুন। সকাল ১০টা থেকে রাত ১০টা সরাসরি উত্তর পাবেন।</p><div class="pay"><button>WhatsApp</button><button>Telegram</button></div><label>আপনার সমস্যা</label><input id="sm" placeholder="এখানে লিখুন"><button class="btn full" id="ss" style="margin-top:12px">পাঠান</button></div>'}

var V={home:home,new:neworder,custom:custom,orders:orders,account:account,support:support};
function go(n){curv=n;
 $('#view').innerHTML=V[n]();$('#menu').classList.remove('on');
 document.querySelectorAll('nav.tab button').forEach(function(b){b.classList.toggle('on',b.dataset.go===n||(n==='custom'&&b.dataset.go==='new'))});
 window.scrollTo(0,0);bind(n)}
function bind(n){
 if(n==='new'){
  $('#op').onchange=function(){sel.p=this.value;sel.s=0;go('new')};
  $('#os').onchange=function(){sel.s=+this.value;calc()};
  $('#oq').oninput=calc;
  $('#ob').onclick=function(){var l=$('#ol').value.trim(),q=+$('#oq').value,e=$('#oe');
   if(!/^https?:\/\//.test(l)){e.textContent='সঠিক লিংক দিন (https:// দিয়ে শুরু)।';return}
   if(q<100){e.textContent='পরিমাণ কমপক্ষে ১০০ হতে হবে।';return}
   var c=q/1000*PF[sel.p].s[sel.s][1];
   if(c>S.bal){e.textContent='ব্যালেন্স কম। আগে অ্যাকাউন্ট থেকে ফান্ড যোগ করুন।';return}
   S.bal-=c;S.orders.push({id:1000+S.orders.length+1,pf:sel.p,sv:PF[sel.p].s[sel.s][0],link:l,q:q,cost:c,st:'Pending',t:Date.now()});persist();head();toast('অর্ডার হয়েছে');go('orders')}}
 if(n==='custom'){$('#cs').onclick=function(){if(!$('#cn').value.trim()||!$('#cl').value.trim()){$('#ce').textContent='কী লাগবে ও লিংক, দুটোই লিখুন।';return}toast('রিকোয়েস্ট পাঠানো হয়েছে');go('home')}}
 if(n==='support'){$('#ss').onclick=function(){toast('মেসেজ পাঠানো হয়েছে');$('#sm').value=''}}
 if(n==='account'){
  $('#pf').onchange=photoUp;$('#da').oninput=function(){$('#dt').textContent='৳'+Math.round((+this.value||0)*RATE)};
  document.querySelectorAll('[data-pm]').forEach(function(b){b.onclick=function(){pm=b.dataset.pm;go('account')}});
  document.querySelectorAll('[data-ap]').forEach(function(b){b.onclick=function(){S.deps.forEach(function(d){if(d.id==+b.dataset.ap&&d.st!=='Approved'){d.st='Approved';S.bal+=d.usd}});persist();head();toast('ব্যালেন্স যোগ হয়েছে');go('account')}});
  $('#db').onclick=function(){var a=+$('#da').value,t=$('#dx').value.trim(),e=$('#de');
   if(!(a>=1)){e.textContent='কমপক্ষে $1 দিন।';return}
   if(t.length<6){e.textContent='সঠিক Transaction ID দিন।';return}
   S.deps.push({id:Date.now(),usd:a,bdt:Math.round(a*RATE),m:pm,trx:t,st:'Pending'});persist();toast('ডিপোজিট রিকোয়েস্ট পাঠানো হয়েছে');go('account')}}
 document.querySelectorAll('#view [data-go]').forEach(function(b){b.onclick=function(){go(b.dataset.go)}});
 document.querySelectorAll('[data-pf]').forEach(function(b){b.onclick=function(){sel.p=b.dataset.pf;sel.s=0;go('new')}})}
document.querySelectorAll('nav.tab [data-go],#menu [data-go]').forEach(function(b){b.onclick=function(){go(b.dataset.go)}});
$('#dots').onclick=function(){msum();$('#menu').classList.toggle('on')};
document.addEventListener('click',function(e){if(!e.target.closest('.hr'))$('#menu').classList.remove('on')});
var curv='home';
function av(){return S.photo?'<img src="'+S.photo+'" alt="প্রোফাইল ছবি" style="width:100%;height:100%;object-fit:cover">':'👤'}
function sum(){var td=new Date().toDateString(),t=S.orders.filter(function(x){return !x.t||new Date(x.t).toDateString()===td});function c(s){return t.filter(function(x){return x.st===s}).length}return {t:t.length,p:c('Pending'),r:c('Processing'),c:c('Completed')}}
function sumHtml(s){return '<div class="mini"><b>'+s.t+'</b><span class="mut">আজকের অর্ডার</span></div><div class="mini"><b style="color:var(--gd)">'+s.p+'</b><span class="mut">Pending</span></div><div class="mini"><b style="color:var(--cy)">'+s.r+'</b><span class="mut">চলছে</span></div><div class="mini"><b style="color:var(--ok)">'+s.c+'</b><span class="mut">শেষ</span></div>'}
function prof(){return '<div class="card"><div class="row" style="justify-content:flex-start;gap:14px"><div class="pav">'+av()+'</div><div><b>আমার প্রোফাইল</b> <span class="mut"><span class="dot"></span> লাইভ</span><div><label class="btn sm" style="display:inline-block;margin-top:6px;cursor:pointer">ছবি যোগ করুন<input type="file" accept="image/*" id="pf" hidden></label></div></div></div><div class="grid" id="asum" style="margin-top:12px;grid-template-columns:repeat(4,1fr)">'+sumHtml(sum())+'</div></div>'}
function msum(){var s=sum();$('#msum').innerHTML='<div class="row" style="justify-content:flex-start;gap:10px"><div class="pav" style="width:38px;height:38px;font-size:18px">'+av()+'</div><b>আজকের অর্ডার</b></div><div class="mut" style="margin-top:6px">মোট '+s.t+' · Pending '+s.p+' · চলছে '+s.r+' · শেষ '+s.c+'</div>'}
function photoUp(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,240/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.photo=c.toDataURL('image/jpeg',.8);persist();toast('ছবি সেভ হয়েছে');msum();go('account')};im.src=r.result};r.readAsDataURL(f)}
function prog(){var n=Date.now(),ch=false;S.orders.forEach(function(o){if(!o.t||o.st==='Completed'||o.st==='Cancelled')return;var a=n-o.t,s=a>60000?'Completed':(a>20000?'Processing':'Pending');if(s!==o.st){o.st=s;ch=true}});if(ch)persist();return ch}
setInterval(function(){var ch=prog();msum();var a=$('#asum');if(a)a.innerHTML=sumHtml(sum());if(ch&&curv==='orders'){$('#view').innerHTML=V.orders();bind('orders')}},2000);
head();go('home');msum();
})();
</script>
