<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EarnHub – SMM Panel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@600;800&display=swap">
<style>
:root{--bg:#0a0b1e;--bg2:#12143a;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--tx:#eef0ff;--mut:#9aa0cf;--cy:#2de2e6;--mg:#ff3d9a;--gd:#ffc93c;--ok:#4be38a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:radial-gradient(800px 460px at 85% -10%,#3a1a6e55,transparent),var(--bg);color:var(--tx);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.55;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:Sora,"Hind Siliguri",sans-serif;margin:0}
.app{max-width:560px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.logo{font:800 20px Sora,sans-serif}.logo b{color:var(--cy)}
.hr{display:flex;gap:8px;align-items:center;position:relative}
.bal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font:700 15px Sora,sans-serif;color:var(--gd)}
.dots{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:22px;cursor:pointer}
.menu{position:absolute;right:0;top:48px;background:#181b4a;border:1px solid var(--line);border-radius:14px;min-width:210px;padding:6px;z-index:15;box-shadow:0 14px 30px #000a;display:none}
.menu.on{display:block}
.menu button{display:flex;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--tx);font:500 16px "Hind Siliguri",sans-serif;padding:8px 10px;border-radius:10px;cursor:pointer}
.menu button:hover{background:var(--card)}
.mi{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;margin-right:10px;background:var(--card);font-size:15px}
.btn{border:0;cursor:pointer;font:600 16px "Hind Siliguri",sans-serif;color:#06112a;padding:12px 22px;border-radius:14px;background:linear-gradient(180deg,#6ff3f5,var(--cy));box-shadow:0 5px 0 #138a90,0 10px 20px #2de2e633;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #138a90}
.btn.mg{color:#fff;background:linear-gradient(180deg,#ff72b8,var(--mg));box-shadow:0 5px 0 #a3185f}
.btn.mg:active{box-shadow:0 1px 0 #a3185f}
.btn.ghost{background:var(--card);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:6px 14px;font-size:14px;border-radius:10px;box-shadow:0 3px 0 #138a90}
.btn[disabled]{filter:grayscale(1) brightness(.6);cursor:wait}
.full{width:100%}
:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.banner{border-radius:22px;padding:20px;margin:6px 0 18px;background:linear-gradient(135deg,#3b1c8f,#c2268a);box-shadow:0 10px 0 #0005,0 18px 36px #0006}
.banner h2{font-size:22px;margin-bottom:4px}.banner p{margin:0 0 12px;opacity:.9}
h3.sec{font-size:18px;margin:18px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pf{border:1px solid var(--line);border-radius:20px;padding:16px 12px;background:linear-gradient(160deg,var(--bg2),#0d0f2b);color:var(--tx);cursor:pointer;text-align:center;font:600 16px "Hind Siliguri",sans-serif;box-shadow:0 7px 0 #0005;transition:transform .15s}
.pf:hover{transform:translateY(-3px) rotateX(6deg)}
.pf small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.ic{width:54px;height:54px;border-radius:16px;margin:0 auto 8px;display:grid;place-items:center;font:800 24px Sora,sans-serif;color:#fff;box-shadow:inset 0 -4px 0 #0004,0 6px 16px #0005}
.yt{background:#e62117}.tt{background:#111;box-shadow:inset 0 -4px 0 #0004,-3px 0 0 #25f4ee,3px 0 0 #fe2c55}.ig{background:linear-gradient(45deg,#f9a03c,#e1306c,#7b3fe4)}.fb{background:#1877f2}.tg{background:#229ed9}.xx{background:#000;border:1px solid #fff4}.sc{background:#fffc00;color:#111}.pn{background:#e60023}.li{background:#0a66c2;font-size:20px}.tw{background:#9146ff}.sp{background:#1db954}.th{background:#101010;border:1px solid #fff4}.wa{background:#25d366}.df{background:#444c8a}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{color:var(--gd);font-weight:700}
.mut{color:var(--mut);font-size:14px}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0a0c2e;color:var(--tx);font:16px "Hind Siliguri",sans-serif}
.tot{font:800 22px Sora,sans-serif;color:var(--cy)}
.err{color:#ff8aa8;font-size:14px;min-height:20px;margin:6px 0}
.badge{padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.pend{background:#ffc93c22;color:var(--gd)}.done{background:#4be38a22;color:var(--ok)}.run{background:#2de2e622;color:var(--cy)}.bad{background:#ff6b8a22;color:#ff8aa8}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.pay button{border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:14px;padding:12px;font:600 16px "Hind Siliguri",sans-serif;cursor:pointer}
.pay button.on{border-color:var(--cy);box-shadow:0 0 18px #2de2e655}
.num{font:700 20px Sora,sans-serif;letter-spacing:1px;color:var(--gd)}
nav.tab{position:fixed;left:0;right:0;bottom:0;background:#0d0f2bee;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tab div{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
nav.tab button{background:none;border:0;color:var(--mut);font:500 11.5px "Hind Siliguri",sans-serif;padding:10px 0;cursor:pointer}
nav.tab button span{display:block;font-size:22px}
nav.tab button.on{color:var(--cy)}
.ms{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.pav{width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--card);display:grid;place-items:center;font-size:28px;border:2px solid var(--cy);flex:none}
.mini{background:#0003;border-radius:12px;padding:8px 4px;text-align:center}.mini b{display:block;font:800 18px Sora,sans-serif}.mini span{font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 10px var(--ok);animation:pl 1.4s infinite}@keyframes pl{50%{opacity:.3}}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ok);color:#04230f;padding:10px 20px;border-radius:99px;font-weight:600;display:none;z-index:30;text-align:center;max-width:90%}
.toast.er{background:#ff6b8a;color:#2a0510}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Earn<b>Hub</b> <span class="mut" style="font:500 13px 'Hind Siliguri'">SMM</span></div>
    <div class="hr">
      <div class="bal" id="bal">$0.00</div>
      <button class="dots" id="dots" aria-label="মেনু">⋮</button>
      <div class="menu" id="menu"><div class="ms" id="msum"></div>
        <button data-go="orders"><span class="mi">📋</span>আমার অর্ডার</button>
        <button data-go="account"><span class="mi">💳</span>ডিপোজিট হিস্টোরি</button>
        <button data-go="support"><span class="mi">🎧</span>কাস্টমার কেয়ার</button>
        <button data-go="custom"><span class="mi">✏️</span>কাস্টম অর্ডার</button>
      </div>
    </div>
  </header>
  <main id="view"><div class="mut" style="text-align:center;padding:40px 0">লোড হচ্ছে...</div></main>
</div>
<nav class="tab"><div>
  <button data-go="home" class="on"><span>🏠</span>হোম</button>
  <button data-go="new"><span>🛒</span>নতুন অর্ডার</button>
  <button data-go="orders"><span>📋</span>অর্ডার</button>
  <button data-go="account"><span>👤</span>অ্যাকাউন্ট</button>
  <button data-go="support"><span>🎧</span>কাস্টমার কেয়ার</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var V=$('#view');
var ST=null,OR=[],page='home',sel={p:'',s:0},pm='bKash',busy=false;
var PI={YouTube:['yt','▶'],TikTok:['tt','♪'],Instagram:['ig','◎'],Facebook:['fb','f'],Telegram:['tg','✈'],'Twitter / X':['xx','X'],Snapchat:['sc','S'],Pinterest:['pn','P'],LinkedIn:['li','in'],Twitch:['tw','T'],Spotify:['sp','♫'],Threads:['th','@'],WhatsApp:['wa','✆']};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function usd(n){return '$'+Number(n||0).toFixed(2)}
function toast(m,bad){var t=$('#toast');t.textContent=m;t.className='toast'+(bad?' er':'');t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2600)}
function dt(d){return new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
async function api(p,b){
  var r=await fetch(p,{method:b!==undefined?'POST':'GET',headers:{'Content-Type':'application/json'},body:b!==undefined?JSON.stringify(b):undefined,credentials:'same-origin'});
  var d={};try{d=await r.json()}catch(e){}
  if(r.status===401){location.href='/';throw new Error('আবার লগইন করুন')}
  if(!r.ok||d.ok===false)throw new Error(d.msg||('সমস্যা হয়েছে ('+r.status+')'));
  return d;
}
function head(){$('#bal').textContent=usd(ST.user.balance)}
function av(){return ST.user.photo?'<img src="'+esc(ST.user.photo)+'" alt="প্রোফাইল ছবি" style="width:100%;height:100%;object-fit:cover">':'👤'}
function sum(){
  var td=new Date().toDateString(),t=OR.filter(function(o){return new Date(o.createdAt).toDateString()===td});
  function c(s){return t.filter(function(o){return o.status===s}).length}
  return {t:t.length,p:c('Pending'),r:c('Processing'),c:c('Completed')};
}
function sumHtml(s){return '<div class="mini"><b>'+s.t+'</b><span class="mut">আজকের অর্ডার</span></div><div class="mini"><b style="color:var(--gd)">'+s.p+'</b><span class="mut">Pending</span></div><div class="mini"><b style="color:var(--cy)">'+s.r+'</b><span class="mut">চলছে</span></div><div class="mini"><b style="color:var(--ok)">'+s.c+'</b><span class="mut">শেষ</span></div>'}
function msum(){
  var e=$('#msum');if(!e||!ST)return;var s=sum();
  e.innerHTML='<div class="row" style="justify-content:flex-start;gap:10px"><div class="pav" style="width:38px;height:38px;font-size:18px">'+av()+'</div><b>আজকের অর্ডার</b></div><div class="mut" style="margin-top:6px">মোট '+s.t+' · Pending '+s.p+' · চলছে '+s.r+' · শেষ '+s.c+'</div>';
}
async function load(){
  var d=await api('/api/state');
  if(d.user.site!=='smm'){location.href='/free';return}
  ST=d;head();
}
async function loadOrders(){var d=await api('/api/smm/orders');OR=d.items;msum()}
function groups(){
  var g={},order=[];
  (ST.cfg.smm||[]).forEach(function(x){if(x.on===false)return;if(!g[x.pf]){g[x.pf]=[];order.push(x.pf)}g[x.pf].push(x)});
  return {g:g,order:order};
}
function icon(pf){var i=PI[pf]||['df',(pf||'?')[0]];return '<div class="ic '+i[0]+'">'+esc(i[1])+'</div>'}

/* ---------- হোম ---------- */
function home(){
  var G=groups(),h='<div class="banner"><h2>সোশ্যাল গ্রোথ, ডলার রেটে</h2><p>ফলোয়ার, লাইক ও ভিউ অর্ডার করুন সহজে।</p><button class="btn mg" data-go="new">অর্ডার করুন</button></div><h3 class="sec">প্ল্যাটফর্ম বেছে নিন</h3><div class="grid">';
  G.order.forEach(function(pf){var mn=Math.min.apply(null,G.g[pf].map(function(x){return Number(x.p)}));
    h+='<button class="pf" data-pf="'+esc(pf)+'">'+icon(pf)+esc(pf)+'<small>১০০০-এ $'+mn+' থেকে</small></button>'});
  h+='</div><h3 class="sec">কাস্টম অর্ডার</h3><div class="card row"><div><b>নিজের মতো অর্ডার</b><div class="mut">লিংক, পরিমাণ ও নোট দিন, আমরা দাম জানাব।</div></div><button class="btn sm" data-go="custom">দিন</button></div>';
  V.innerHTML=h;
}

/* ---------- নতুন অর্ডার ---------- */
function neworder(){
  var G=groups();if(!G.order.length){V.innerHTML='<div class="card mut">এখন কোনো সার্ভিস চালু নেই।</div>';return}
  if(!G.g[sel.p]){sel.p=G.order[0];sel.s=0}
  var list=G.g[sel.p],s=list[sel.s]||list[0];
  var h='<h3 class="sec">নতুন অর্ডার</h3><div class="card"><label>প্ল্যাটফর্ম</label><select id="op">'+G.order.map(function(k){return '<option'+(k===sel.p?' selected':'')+'>'+esc(k)+'</option>'}).join('')+'</select><label>সার্ভিস</label><select id="os">'+list.map(function(x,i){return '<option value="'+i+'"'+(i===sel.s?' selected':'')+'>'+esc(x.sv)+' ($'+x.p+' / ১০০০)</option>'}).join('')+'</select><label>লিংক</label><input id="ol" placeholder="https://..." autocapitalize="none"><label>পরিমাণ (সর্বনিম্ন ১০০)</label><input id="oq" type="number" inputmode="numeric" value="1000" min="100"><div class="row" style="margin-top:14px"><span class="mut">মোট দাম</span><span class="tot" id="ot">'+usd(s.p)+'</span></div><div class="err" id="oe"></div><button class="btn full" id="ob">অর্ডার দিন</button></div>';
  V.innerHTML=h;
  function calc(){var q=Number($('#oq').value)||0;$('#ot').textContent=usd(Math.round(q/1000*Number(s.p)*100)/100)}
  $('#op').onchange=function(){sel.p=this.value;sel.s=0;neworder()};
  $('#os').onchange=function(){sel.s=Number(this.value);neworder()};
  $('#oq').oninput=calc;
  $('#ob').onclick=async function(){
    var b=this,e=$('#oe');e.textContent='';b.disabled=true;
    try{
      await api('/api/smm/order',{pf:sel.p,sv:s.sv,link:$('#ol').value.trim(),qty:Number($('#oq').value)});
      toast('অর্ডার হয়েছে');await load();await loadOrders();go('orders');
    }catch(x){e.textContent=x.message;b.disabled=false}
  };
}

/* ---------- কাস্টম অর্ডার ---------- */
function custom(){
  V.innerHTML='<h3 class="sec">কাস্টম অর্ডার</h3><div class="card"><label>কী লাগবে?</label><input id="cn" placeholder="যেমন: ৫০০ কমেন্ট, ভিডিও লিংকসহ"><label>লিংক</label><input id="cl" placeholder="https://..." autocapitalize="none"><label>আপনার বাজেট ($)</label><input id="cb" type="number" inputmode="decimal"><div class="err" id="ce"></div><button class="btn full" id="cs">রিকোয়েস্ট পাঠান</button></div>';
  $('#cs').onclick=async function(){
    var b=this,e=$('#ce');e.textContent='';b.disabled=true;
    try{await api('/api/smm/custom',{text:$('#cn').value,link:$('#cl').value,budget:Number($('#cb').value)||0});toast('রিকোয়েস্ট পাঠানো হয়েছে');go('home')}
    catch(x){e.textContent=x.message;b.disabled=false}
  };
}

/* ---------- অর্ডার ---------- */
function stCls(s){return s==='Completed'?'done':(s==='Processing'?'run':(s==='Cancelled'?'bad':'pend'))}
async function orders(){
  V.innerHTML='<div class="mut" style="text-align:center;padding:30px">লোড হচ্ছে...</div>';
  try{await loadOrders()}catch(e){V.innerHTML='<div class="card mut">'+esc(e.message)+'</div>';return}
  var h='<h3 class="sec">আমার অর্ডার</h3>';
  if(!OR.length)h+='<div class="card mut">এখনো কোনো অর্ডার নেই। প্রথম অর্ডার দিতে "নতুন অর্ডার" চাপুন।</div>';
  OR.forEach(function(o){h+='<div class="card"><div class="row"><b>'+esc(o.pf)+' '+esc(o.sv)+'</b><span class="badge '+stCls(o.status)+'">'+esc(o.status)+'</span></div><div class="mut" style="word-break:break-all">'+esc(o.link)+'</div><div class="row"><span>'+o.qty+' টি · '+dt(o.createdAt)+'</span><span class="price">'+usd(o.cost)+'</span></div></div>'});
  V.innerHTML=h;
}

/* ---------- অ্যাকাউন্ট ---------- */
function account(){
  var u=ST.user,c=ST.cfg,rate=c.rate||125,num=pm==='bKash'?c.set.bk:c.set.ng;
  var h='<div class="card"><div class="row" style="justify-content:flex-start;gap:14px"><div class="pav">'+av()+'</div><div><b>'+esc(u.username)+'</b> <span class="mut"><span class="dot"></span> লাইভ</span><div><label class="btn sm" style="display:inline-block;margin-top:6px;cursor:pointer">ছবি যোগ করুন<input type="file" accept="image/*" id="pf" hidden></label></div></div></div><div class="grid" id="asum" style="margin-top:12px;grid-template-columns:repeat(4,1fr)">'+sumHtml(sum())+'</div></div>';
  h+='<div class="card"><div class="mut">বর্তমান ব্যালেন্স</div><div class="tot">'+usd(u.balance)+'</div></div><h3 class="sec">ফান্ড যোগ করুন</h3><div class="card"><label>পরিমাণ (ডলার)</label><input id="da" type="number" inputmode="decimal" value="1" min="1"><div class="row" style="margin-top:8px"><span class="mut">১ ডলার = ৳'+rate+'</span><b id="dt" class="price">৳'+rate+'</b></div><label>পেমেন্ট মাধ্যম</label><div class="pay"><button data-pm="bKash" class="'+(pm==='bKash'?'on':'')+'">bKash</button><button data-pm="Nagad" class="'+(pm==='Nagad'?'on':'')+'">Nagad</button></div><div class="mut">এই নাম্বারে Send Money করুন:</div><div class="num">'+esc(num)+'</div><label>Transaction ID</label><input id="dx" autocapitalize="characters" placeholder="যেমন: 8N7A6D5E4C"><div class="err" id="de"></div><button class="btn full" id="db">ডিপোজিট সাবমিট</button></div><h3 class="sec">ডিপোজিট হিস্টোরি</h3><div id="hist"><div class="mut">লোড হচ্ছে...</div></div><button class="btn ghost full" id="lo" style="margin-top:18px">লগআউট</button>';
  V.innerHTML=h;
  $('#pf').onchange=photo;
  $('#da').oninput=function(){$('#dt').textContent='৳'+Math.round((Number(this.value)||0)*rate)};
  $('#db').onclick=async function(){
    var b=this,e=$('#de');e.textContent='';b.disabled=true;
    try{await api('/api/deposit',{amount:Number($('#da').value),method:pm,trx:$('#dx').value.trim()});toast('ডিপোজিট রিকোয়েস্ট পাঠানো হয়েছে');await load();account()}
    catch(x){e.textContent=x.message;b.disabled=false}
  };
  $('#lo').onclick=function(){api('/api/logout',{}).catch(function(){}).then(function(){location.href='/'})};
  loadOrders().then(function(){var a=$('#asum');if(a)a.innerHTML=sumHtml(sum())}).catch(function(){});
  hist();
}
async function hist(){
  var e=$('#hist');if(!e)return;
  try{
    var d=await api('/api/requests'),rate=ST.cfg.rate||125;
    e.innerHTML=d.items.length?d.items.map(function(x){var cls=x.status==='approved'?'done':(x.status==='rejected'?'bad':'pend'),tx=x.status==='approved'?'গৃহীত':(x.status==='rejected'?'বাতিল':(x.status==='pending'?'অপেক্ষমাণ':x.status));
      return '<div class="card"><div class="row"><b>'+usd(x.amount)+' (৳'+Math.round(x.amount*rate)+')</b><span class="badge '+cls+'">'+esc(tx)+'</span></div><div class="mut">'+esc(x.method)+' · '+esc(x.reference)+' · '+dt(x.createdAt)+'</div></div>'}).join(''):'<div class="card mut">কোনো ডিপোজিট নেই।</div>';
  }catch(x){e.innerHTML='<div class="card mut">'+esc(x.message)+'</div>'}
}
function photo(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=async function(){
    var s=Math.min(1,240/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    try{await api('/api/photo',{data:c.toDataURL('image/jpeg',.8)});toast('ছবি সেভ হয়েছে');await load();msum();account()}catch(e){toast(e.message,true)}
  };im.src=r.result};r.readAsDataURL(f);
}

/* ---------- কাস্টমার কেয়ার ---------- */
function support(){
  V.innerHTML='<h3 class="sec">কাস্টমার কেয়ার</h3><div class="card"><b>আমরা সাহায্য করতে প্রস্তুত</b><p class="mut">অর্ডার, ডিপোজিট বা অন্য সমস্যায় লিখুন, আমরা যোগাযোগ করব।</p><label>আপনার সমস্যা</label><input id="sm" placeholder="এখানে লিখুন"><button class="btn full" id="ss" style="margin-top:12px">পাঠান</button></div>';
  $('#ss').onclick=async function(){var m=$('#sm').value.trim();if(!m){toast('কিছু লিখুন',true);return}try{await api('/api/support',{message:m});$('#sm').value='';toast('মেসেজ পাঠানো হয়েছে')}catch(e){toast(e.message,true)}};
}

/* ---------- নেভিগেশন ---------- */
var VIEWS={home:home,new:neworder,custom:custom,orders:orders,account:account,support:support};
function go(n){
  page=n;$('#menu').classList.remove('on');
  document.querySelectorAll('nav.tab button').forEach(function(b){b.classList.toggle('on',b.dataset.go===n||(n==='custom'&&b.dataset.go==='new'))});
  window.scrollTo(0,0);VIEWS[n]();
}
document.addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-go]'))){go(t.dataset.go);return}
  if((t=e.target.closest('[data-pf]'))){sel.p=t.dataset.pf;sel.s=0;go('new');return}
  if((t=e.target.closest('[data-pm]'))){pm=t.dataset.pm;account();return}
  if(e.target.closest('#dots')){msum();$('#menu').classList.toggle('on');return}
  if(!e.target.closest('.hr'))$('#menu').classList.remove('on');
});
// প্রতি ১৫ সেকেন্ডে ব্যালেন্স ও অর্ডারের অবস্থা নিজে আপডেট
setInterval(async function(){
  try{
    await load();await loadOrders();
    var a=$('#asum');if(a)a.innerHTML=sumHtml(sum());
    if(page==='orders'){
      var h='<h3 class="sec">আমার অর্ডার</h3>';
      if(!OR.length)h+='<div class="card mut">এখনো কোনো অর্ডার নেই।</div>';
      OR.forEach(function(o){h+='<div class="card"><div class="row"><b>'+esc(o.pf)+' '+esc(o.sv)+'</b><span class="badge '+stCls(o.status)+'">'+esc(o.status)+'</span></div><div class="mut" style="word-break:break-all">'+esc(o.link)+'</div><div class="row"><span>'+o.qty+' টি · '+dt(o.createdAt)+'</span><span class="price">'+usd(o.cost)+'</span></div></div>'});
      V.innerHTML=h;
    }
  }catch(e){}
},15000);
load().then(function(){return loadOrders()}).then(function(){go('home')}).catch(function(e){V.innerHTML='<div class="card mut">'+esc(e.message)+'</div>'});
})();
</script>
