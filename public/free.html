<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EarnHub – Free Income</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@600;800&display=swap">
<style>
:root{--bg:#0a0b1e;--bg2:#12143a;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--tx:#eef0ff;--mut:#9aa0cf;--cy:#2de2e6;--mg:#ff3d9a;--gd:#ffc93c;--ok:#4be38a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:radial-gradient(800px 460px at 85% -10%,#6e1a5a55,transparent),radial-gradient(600px 400px at -10% 40%,#0b5a7a33,transparent),var(--bg);color:var(--tx);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.55;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:Sora,"Hind Siliguri",sans-serif;margin:0}
.app{max-width:560px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.logo{font:800 20px Sora,sans-serif}.logo b{color:var(--mg)}
.hr{display:flex;gap:8px;align-items:center;position:relative}
.bal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font:700 15px Sora,sans-serif;color:var(--gd)}
.dots{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:22px;cursor:pointer}
.menu{position:absolute;right:0;top:48px;background:#181b4a;border:1px solid var(--line);border-radius:14px;min-width:210px;padding:6px;z-index:15;box-shadow:0 14px 30px #000a;display:none}
.menu.on{display:block}
.menu button{display:flex;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--tx);font:500 16px "Hind Siliguri",sans-serif;padding:8px 10px;border-radius:10px;cursor:pointer}
.menu button:hover{background:var(--card)}
.mi{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;margin-right:10px;background:var(--card);font-size:15px}
.btn{border:0;cursor:pointer;font:600 16px "Hind Siliguri",sans-serif;color:#06112a;padding:12px 22px;border-radius:14px;background:linear-gradient(180deg,#6ff3f5,var(--cy));box-shadow:0 5px 0 #138a90,0 10px 20px #2de2e633;transition:transform .12s,box-shadow .12s;text-decoration:none;display:inline-block;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #138a90}
.btn.mg{color:#fff;background:linear-gradient(180deg,#ff72b8,var(--mg));box-shadow:0 5px 0 #a3185f}
.btn.gd{background:linear-gradient(180deg,#ffe28a,var(--gd));box-shadow:0 5px 0 #b98400}
.btn.gd:active{box-shadow:0 1px 0 #b98400}
.btn.ghost{background:var(--card);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:6px 14px;font-size:14px;border-radius:10px;box-shadow:0 3px 0 #138a90}
.btn[disabled]{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.full{width:100%;display:block}
:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.theme{position:relative;border-radius:22px;overflow:hidden;margin:6px 0 4px;height:170px;box-shadow:0 10px 0 #0005,0 18px 36px #0006}
.sl{position:absolute;inset:0;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;opacity:0;transition:opacity .6s;cursor:pointer;border:0;color:#fff;text-align:left;width:100%;font-family:inherit}
.sl.on{opacity:1}
.sl b{font:800 22px Sora,sans-serif}.sl span{opacity:.92}
.sl .tag{position:absolute;top:14px;right:14px;background:#0006;border-radius:99px;padding:2px 10px;font-size:12px}
.dts{display:flex;gap:6px;justify-content:center;margin:10px 0 0}
.dts i{width:7px;height:7px;border-radius:9px;background:var(--line);transition:all .3s}.dts i.on{width:20px;background:var(--cy)}
h3.sec{font-size:18px;margin:22px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--tx);padding:10px 2px;font:600 13px "Hind Siliguri",sans-serif;cursor:pointer}
.quick button span{display:block;font-size:24px}
.bn{border:1px solid var(--line);border-radius:18px;padding:14px;background:linear-gradient(160deg,var(--bg2),#0d0f2b);box-shadow:0 6px 0 #0005}
.bn .e{font-size:26px}.bn b{display:block}.bn .mut{margin-bottom:8px}
.vip{grid-column:1/-1;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#6a4a00,#2a1c00 70%);border-color:#ffc93c66}
.vip>div{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{color:var(--gd);font-weight:700}
.mut{color:var(--mut);font-size:14px}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0a0c2e;color:var(--tx);font:16px "Hind Siliguri",sans-serif}
.tot{font:800 22px Sora,sans-serif;color:var(--cy)}
.err{color:#ff8aa8;font-size:14px;min-height:20px;margin:6px 0}
.badge{padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.pend{background:#ffc93c22;color:var(--gd)}.done{background:#4be38a22;color:var(--ok)}.bad{background:#ff6b8a22;color:#ff8aa8}
.wheelbox{position:relative;width:min(300px,84vw);aspect-ratio:1;margin:8px auto 16px}
.wheelbox canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 8px #2a2d6e,0 0 0 12px var(--gd),0 0 44px #ffc93c66,0 14px 0 8px #0006;transition:transform 5s cubic-bezier(.12,.7,.1,1)}
.ptr{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:28px solid var(--mg);filter:drop-shadow(0 3px 0 #0008);z-index:2}
.hub{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gd));display:grid;place-items:center;font:800 20px Sora,sans-serif;color:#7a4a00;box-shadow:0 4px 0 #b98400;z-index:2}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#00000044;border-radius:14px;padding:4px;margin-bottom:12px}
.tabs.t3{grid-template-columns:repeat(3,1fr)}
.tabs button{border:0;background:none;color:var(--mut);font:600 15px "Hind Siliguri",sans-serif;padding:9px 4px;border-radius:11px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--tx)}
.pk{border-radius:20px;padding:18px;margin-bottom:14px;border:1px solid var(--line);box-shadow:0 8px 0 #0005}
.pk h3{font-size:20px}.pk ul{margin:8px 0 12px;padding-left:18px;color:var(--mut)}
.p0{background:linear-gradient(150deg,#1b2050,#10132e)}.p1{background:linear-gradient(150deg,#4a5568,#1e2538)}.p2{background:linear-gradient(150deg,#8a6a10,#2a2108)}.p3{background:linear-gradient(150deg,#1a7a96,#16206a)}
.tk{display:flex;align-items:center;gap:12px}
.tk .ti{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#6a2cc9,#c2268a);box-shadow:inset 0 -4px 0 #0004;flex:none}
.tk.v .ti{background:linear-gradient(135deg,#e62117,#7a1010)}
.tk>div:nth-child(2){flex:1;min-width:0}
.lk{font-size:13px;color:var(--cy);word-break:break-all}
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:6px 0 16px;text-align:center}
.pc{border-radius:18px 18px 8px 8px;padding:12px 4px 10px;border:1px solid var(--line);box-shadow:0 6px 0 #0005}
.pc.g1{background:linear-gradient(180deg,#a37b00,#3a2a00);min-height:170px;border-color:#ffc93c99;box-shadow:0 6px 0 #0005,0 0 30px #ffc93c44}
.pc.g2{background:linear-gradient(180deg,#6b7488,#232838);min-height:140px}
.pc.g3{background:linear-gradient(180deg,#8a5a34,#2a1a0e);min-height:125px}
.av{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font:800 17px Sora,sans-serif;background:linear-gradient(135deg,var(--cy),var(--mg));color:#06112a;box-shadow:0 3px 0 #0006}
.pc .cr{font-size:20px;height:24px}
.pc b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.rk{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.rk .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 14px Sora,sans-serif;background:var(--card)}
.me{border:1px solid var(--cy);box-shadow:0 0 24px #2de2e633;background:linear-gradient(135deg,#0d3a5a,#16206a)}
.bar{height:10px;border-radius:9px;background:#0007;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--mg));transition:width 1s linear}
.refc{font:800 26px Sora,sans-serif;letter-spacing:3px;color:var(--gd);text-align:center;border:2px dashed #ffc93c88;border-radius:14px;padding:10px;margin:10px 0}
.feed .f{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);animation:fi .5s}
@keyframes fi{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pl 1.4s infinite;display:inline-block}
@keyframes pl{50%{opacity:.3}}
.promo{border-radius:18px;padding:18px;margin-bottom:12px;color:#fff;box-shadow:0 6px 0 #0005}
.promo b{font:700 19px Sora,sans-serif}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.pay button{border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:14px;padding:12px;font:600 16px "Hind Siliguri",sans-serif;cursor:pointer}
.pay button.on{border-color:var(--cy);box-shadow:0 0 18px #2de2e655}
.num{font:700 20px Sora,sans-serif;letter-spacing:1px;color:var(--gd)}
nav.tab{position:fixed;left:0;right:0;bottom:0;background:#0d0f2bee;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tab div{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
nav.tab button{background:none;border:0;color:var(--mut);font:500 12px "Hind Siliguri",sans-serif;padding:10px 0;cursor:pointer}
nav.tab button span{display:block;font-size:22px}
nav.tab button.on{color:var(--mg)}
.ms{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.pav{width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--card);display:grid;place-items:center;font-size:28px;border:2px solid var(--mg);flex:none}
.mini{background:#0003;border-radius:12px;padding:8px 4px;text-align:center}.mini b{display:block;font:800 18px Sora,sans-serif}.mini span{font-size:12px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ok);color:#04230f;padding:10px 20px;border-radius:99px;font-weight:600;display:none;z-index:30;text-align:center;max-width:90%}
.toast.er{background:#ff6b8a;color:#2a0510}
.ov{position:fixed;inset:0;background:#020312dd;display:none;align-items:center;justify-content:center;z-index:25;padding:20px}
.ov.on{display:flex}
.mb{width:100%;max-width:380px;background:#181b4a;border:1px solid var(--line);border-radius:22px;padding:22px;text-align:center}
.wbar{display:flex;align-items:center;gap:8px;margin:0 0 10px;overflow-x:auto;scrollbar-width:none}
.wbar::-webkit-scrollbar{display:none}
.rs{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 13px Sora,sans-serif;color:#7a4a00;background:radial-gradient(circle at 32% 28%,#fff3b0,var(--gd) 55%,#c98a00);box-shadow:0 0 0 3px #e0a90055}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 11px;font:700 14px Sora,sans-serif;cursor:pointer}
.chip.r{color:#ff6b8a}.chip.b{color:#fff;background:#111;border-color:#ffffff44}.chip.t{color:var(--gd)}
.exb{flex:none;border:0;border-radius:12px;padding:8px 12px;font:600 13px "Hind Siliguri",sans-serif;color:#06112a;background:linear-gradient(180deg,#6ff3f5,var(--cy));cursor:pointer}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Earn<b>Hub</b> <span class="mut" style="font:500 13px 'Hind Siliguri'">Free Income</span></div>
    <div class="hr">
      <button class="dots" id="dots" aria-label="মেনু">⋮</button>
      <div class="menu" id="menu"><div class="ms" id="msum"></div>
        <button data-go="pack"><span class="mi">💎</span>প্যাকেজ</button>
        <button data-go="ref"><span class="mi">🤝</span>রেফারেল</button>
        <button data-go="support"><span class="mi">🎧</span>কাস্টমার কেয়ার</button>
        <button data-go="about"><span class="mi">ℹ️</span>About</button>
      </div>
    </div>
  </header>
  <div class="wbar" id="wbar"><div class="rs">RS</div><div class="chip r" id="cr" data-ex="red">♦ 0</div><div class="chip b" id="cb" data-ex="black">♦ 0</div><div class="chip t" id="ct">৳0</div><button class="exb" data-ex="red">⇄ এক্সচেঞ্জ</button></div>
  <main id="view"><div class="mut" style="text-align:center;padding:40px 0">লোড হচ্ছে...</div></main>
</div>
<nav class="tab"><div>
  <button data-go="home" class="on"><span>🏠</span>হোম</button>
  <button data-go="task"><span>✅</span>টাস্ক</button>
  <button data-go="promo"><span>📣</span>প্রমোশন</button>
  <button data-go="rank"><span>🏆</span>র‍্যাংকিং</button>
  <button data-go="acc"><span>👤</span>অ্যাকাউন্ট</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>
<div class="ov" id="ov"><div class="mb"><h3>টাস্ক চলছে</h3><p class="mut" id="mp"></p><a class="btn full" id="ml" href="#" target="_blank" rel="noopener">অফিসিয়াল লিংক খুলুন</a><div class="bar"><i id="mbar"></i></div><div class="tot" id="mc">10</div><button class="btn gd full" id="mclaim" style="margin-top:14px" disabled>রিওয়ার্ড নিন</button><button class="btn sm ghost" id="mx" style="margin-top:12px">বাতিল</button></div></div>
<div class="ov" id="xo"><div class="mb" style="text-align:left"><h3 style="margin-bottom:6px">⇄ এক্সচেঞ্জ</h3><div class="mut" id="xi"></div><div class="pay" id="xs"><button data-xf="red">♦ রেড</button><button data-xf="black">♦ ব্ল্যাক</button></div><label>কত ডায়মন্ড বদলাবেন</label><input id="xa" type="number" inputmode="numeric" placeholder="পরিমাণ"><div class="row" style="margin-top:8px"><span class="mut">পাবেন</span><b class="tot" id="xt">৳0</b></div><div class="err" id="xe"></div><button class="btn gd full" id="xg">এক্সচেঞ্জ করুন</button><button class="btn sm ghost" id="xc" style="margin-top:10px">বন্ধ করুন</button></div></div>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var V=$('#view');
var ST=null,page='home',tt='ad',rt='week',wt='dep',pm='bKash',rot=0,spinning=false,sl=null,cur=null,tm=null,busy=false;
var GR=['linear-gradient(135deg,#1a7a96,#16206a)','linear-gradient(135deg,#e8501c,#a31d5c)','linear-gradient(135deg,#6a2cc9,#2b1a7a)','linear-gradient(135deg,#0f8a5a,#164a6a)'];
var LV=[['Bronze',0,'🥉'],['Silver',500,'🥈'],['Gold',2000,'🥇'],['Platinum',8000,'💠'],['Diamond',25000,'💎']];
var BI={daily:'🎁',login:'🔑',week:'📅',month:'🗓️',vip:'👑'};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fm(n){return Number(n||0).toFixed(2).replace(/\.?0+$/,'')}
function toast(m,bad){var t=$('#toast');t.textContent=m;t.className='toast'+(bad?' er':'');t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2600)}
function dt(d){return new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
async function api(p,b){
  var r=await fetch(p,{method:b!==undefined?'POST':'GET',headers:{'Content-Type':'application/json'},body:b!==undefined?JSON.stringify(b):undefined,credentials:'same-origin'});
  var d={};try{d=await r.json()}catch(e){}
  if(r.status===401){location.href='/';throw new Error('আবার লগইন করুন')}
  if(!r.ok||d.ok===false)throw new Error(d.msg||('সমস্যা হয়েছে ('+r.status+')'));
  return d;
}
function pk(){return ST.cfg.pk[ST.user.pkg]||ST.cfg.pk[0]}
function head(){var u=ST.user;$('#cr').textContent='♦ '+fm(u.red);$('#cb').textContent='♦ '+fm(u.black);$('#ct').textContent='৳'+fm(u.balance)}
var xf='red';
function exInfo(){
  var ex=ST.cfg.ex,u=ST.user,per=Number(xf==='red'?ex.redPer:ex.blackPer)||1,min=xf==='red'?ex.minRed:ex.minBlack,have=xf==='red'?u.red:u.black;
  $('#xi').innerHTML='১ ডায়মন্ড = ৳'+fm(1/per)+' · কমপক্ষে '+min+' ডায়মন্ড · আজ ৳'+fm(ST.exUsed)+'/'+fm(ex.capTaka)+' এক্সচেঞ্জ হয়েছে<br>আপনার '+(xf==='red'?'রেড':'ব্ল্যাক')+' ডায়মন্ড: <b>'+fm(have)+'</b>';
  document.querySelectorAll('#xs button').forEach(function(b){b.classList.toggle('on',b.dataset.xf===xf)});
  var a=Math.floor(Number($('#xa').value)||0);$('#xt').textContent='৳'+fm(a/per);
}
function openEx(f){if(!ST)return;xf=f||'red';$('#xa').value='';$('#xe').textContent='';$('#xo').classList.add('on');exInfo()}
async function doEx(){
  var b=$('#xg'),e=$('#xe');e.textContent='';b.disabled=true;
  try{var r=await api('/api/exchange',{from:xf,amount:Number($('#xa').value)});$('#xo').classList.remove('on');toast('৳'+fm(r.taka)+' ব্যালেন্সে যোগ হয়েছে');await load();go(page)}
  catch(x){e.textContent=x.message}
  b.disabled=false;
}
function av(){return ST.user.photo?'<img src="'+esc(ST.user.photo)+'" alt="প্রোফাইল ছবি" style="width:100%;height:100%;object-fit:cover">':'👤'}
function cnt(){return (ST.today.tasks||[]).length}
function msum(){
  var e=$('#msum');if(!e||!ST)return;var p=pk(),c=cnt();
  e.innerHTML='<div class="row" style="justify-content:flex-start;gap:10px"><div class="pav" style="width:38px;height:38px;font-size:18px">'+av()+'</div><b>আজকের টাস্ক</b></div><div class="mut" style="margin-top:6px">শেষ '+c+'/'+p.lim+' · বাকি '+Math.max(0,p.lim-c)+' · পেন্ডিং রিকোয়েস্ট '+ST.pendingRequests+'</div>';
}
async function load(){
  var d=await api('/api/state');
  if(d.user.site!=='free'){location.href='/smm';return}
  ST=d;head();msum();
}
function left(key,h){var t=ST.last&&ST.last[key];if(!t)return 0;return new Date(t).getTime()+h*36e5-Date.now()}
function fmt(ms){var h=Math.ceil(ms/36e5);return h>24?Math.ceil(h/24)+' দিন':h+' ঘণ্টা'}

function draw(){
  var c=$('#wh');if(!c)return;var v=ST.cfg.wv,n=v.length,x=c.getContext('2d'),r=300,a=Math.PI*2/n,cols=['#c2268a','#3b1c8f'];
  for(var i=0;i<n;i++){x.beginPath();x.moveTo(r,r);x.arc(r,r,r,-Math.PI/2+i*a,-Math.PI/2+(i+1)*a);x.fillStyle=v[i]>=50?'#e0a900':cols[i%2];x.fill();x.strokeStyle='#ffffff55';x.lineWidth=2;x.stroke();
    x.save();x.translate(r,r);x.rotate(-Math.PI/2+(i+.5)*a);x.fillStyle='#fff';x.font='700 34px Sora,sans-serif';x.textAlign='right';x.fillText('♦'+v[i],r-26,12);x.restore()}
}

    rot=rot-(rot%360)+360*6+(360-ctr);$('#wh').style.transform='rotate('+rot+'deg)';
    setTimeout(async function(){spinning=false;toast('অভিনন্দন! ♦'+fm(r.value)+' রেড ডায়মন্ড জিতেছেন');await load();go('home')},5200);

function taskData(id){
  var m=/^(ad|vid)(\d+)$/.exec(id);
  if(m){var x=tasksOf(m[1])[Number(m[2])];return x?{link:x.t.l,rw:pk().rw}:null}
  m=/^p(\d+)$/.exec(id);
  if(m){var p=ST.cfg.pr[Number(m[1])];return p?{link:p.l,rw:p.rw}:null}
  return null;
}
async function begin(id){
  var d=taskData(id);if(!d)return;
  if(id[0]!=='p'&&cnt()>=pk().lim){toast('আজকের লিমিট শেষ। প্যাকেজ আপগ্রেড করুন।',true);return}
  try{await api('/api/task/start',{id:id})}catch(e){toast(e.message,true);return}
  cur=id;var s=10;
  $('#ml').href=d.link;$('#mp').textContent='লিংক খুলে ১০ সেকেন্ড অপেক্ষা করুন';$('#mc').textContent=s;
  $('#mbar').style.transitionDuration='0s';$('#mbar').style.width='0';$('#mclaim').disabled=true;$('#ov').classList.add('on');
  setTimeout(function(){$('#mbar').style.transitionDuration='10s';$('#mbar').style.width='100%'},40);

}

  h+='<div class="card"><div class="mut">আপনার ব্যালেন্স</div><div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:8px"><div class="mini"><b style="color:#ff6b8a">♦ '+fm(u.red)+'</b><span class="mut">রেড ডায়মন্ড</span></div><div class="mini"><b>♦ '+fm(u.black)+'</b><span class="mut">ব্ল্যাক ডায়মন্ড</span></div><div class="mini"><b style="color:var(--gd)">৳'+fm(u.balance)+'</b><span class="mut">আসল টাকা</span></div></div><button class="btn gd full" data-ex="red" style="margin-top:12px">⇄ এক্সচেঞ্জ (ডায়মন্ড থেকে টাকা)</button></div><div class="tabs"><button data-wt="dep" class="'+(wt==='dep'?'on':'')+'">ডিপোজিট</button><button data-wt="wd" class="'+(wt==='wd'?'on':'')+'">উইথড্র</button></div><div class="card"><div class="pay"><button data-pm="bKash" class="'+(pm==='bKash'?'on':'')+'">bKash</button><button data-pm="Nagad" class="'+(pm==='Nagad'?'on':'')+'">Nagad</button></div>';
  var num=pm==='bKash'?c.set.bk:c.set.ng;
  if(wt==='dep')h+='<div class="mut">এই নাম্বারে Send Money করুন:</div><div class="num">'+esc(num)+'</div><label>পরিমাণ (৳)</label><input id="wa" type="number" inputmode="numeric" placeholder="কমপক্ষে '+(c.set.mindep||50)+'"><label>Transaction ID</label><input id="wx" autocapitalize="characters"><div class="err" id="we"></div><button class="btn full" id="wb">ডিপোজিট সাবমিট</button>';
  else h+='<label>আপনার '+pm+' নাম্বার</label><input id="wx" type="tel" inputmode="tel" placeholder="01XXXXXXXXX"><label>পরিমাণ (৳, কমপক্ষে '+(c.set.minwd||200)+')</label><input id="wa" type="number" inputmode="numeric"><div class="err" id="we"></div><button class="btn full" id="wb">উইথড্র রিকোয়েস্ট</button>';
  h+='</div><h3 class="sec">হিস্টোরি</h3><div id="hist"><div class="mut">লোড হচ্ছে...</div></div><button class="btn ghost full" id="lo" style="margin-top:18px">লগআউট</button>';
  V.innerHTML=h;
  $('#pf').onchange=photo;
  $('#wb').onclick=submitMoney;
  $('#lo').onclick=function(){api('/api/logout',{}).catch(function(){}).then(function(){location.href='/'})};
  hist();
}
async function hist(){
  var e=$('#hist');if(!e)return;
  try{
    var d=await api('/api/requests');
    e.innerHTML=d.items.length?d.items.map(function(x){var cls=x.status==='approved'?'done':(x.status==='rejected'?'bad':'pend'),tx=x.status==='approved'?'গৃহীত':(x.status==='rejected'?'বাতিল':'অপেক্ষমাণ');
      return '<div class="card"><div class="row"><b>'+(x.type==='deposit'?'ডিপোজিট':'উইথড্র')+' ৳'+fm(x.amount)+'</b><span class="badge '+cls+'">'+esc(tx)+'</span></div><div class="mut">'+esc(x.method)+' · '+esc(x.reference)+' · '+dt(x.createdAt)+'</div></div>'}).join(''):'<div class="card mut">কোনো হিস্টোরি নেই।</div>';
  }catch(x){e.innerHTML='<div class="card mut">'+esc(x.message)+'</div>'}
}
async function submitMoney(){
  var b=this,er=$('#we'),a=$('#wa').value,x=$('#wx').value.trim();er.textContent='';b.disabled=true;
  try{
    if(wt==='dep')await api('/api/deposit',{amount:Number(a),method:pm,trx:x});
    else await api('/api/withdraw',{amount:Number(a),method:pm,account:x});
    toast(wt==='dep'?'ডিপোজিট রিকোয়েস্ট পাঠানো হয়েছে':'উইথড্র রিকোয়েস্ট পাঠানো হয়েছে');
    await load();go('acc');
  }catch(e){er.textContent=e.message;b.disabled=false}
}
function photo(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=async function(){
    var s=Math.min(1,240/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    try{await api('/api/photo',{data:c.toDataURL('image/jpeg',.8)});toast('ছবি সেভ হয়েছে');await load();go('acc')}catch(e){toast(e.message,true)}
  };im.src=r.result};r.readAsDataURL(f);
}

/* ---------- নেভিগেশন ---------- */
var VIEWS={home:home,task:task,promo:promo,pack:pack,rank:rank,ref:ref,acc:acc,about:about,support:support};
function go(n){
  page=n;clearInterval(sl);$('#menu').classList.remove('on');
  document.querySelectorAll('nav.tab button').forEach(function(b){b.classList.toggle('on',b.dataset.go===n)});
  window.scrollTo(0,0);VIEWS[n]();
}
document.addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-xf]'))){xf=t.dataset.xf;exInfo();return}
  if((t=e.target.closest('[data-ex]'))){openEx(t.dataset.ex);return}
  if((t=e.target.closest('[data-go]'))){go(t.dataset.go);return}
  if((t=e.target.closest('[data-tk]'))){begin(t.dataset.tk);return}
  if((t=e.target.closest('[data-bn]'))){claimBonus(t.dataset.bn);return}
  if((t=e.target.closest('[data-pk]'))){buy(Number(t.dataset.pk));return}
  if((t=e.target.closest('[data-tt]'))){tt=t.dataset.tt;task();return}
  if((t=e.target.closest('[data-rt]'))){rt=t.dataset.rt;rank();return}
  if((t=e.target.closest('[data-wt]'))){wt=t.dataset.wt;acc();return}
  if((t=e.target.closest('[data-pm]'))){pm=t.dataset.pm;acc();return}
  if((t=e.target.closest('[data-copy]'))){copy(t.dataset.copy);return}
  if(e.target.closest('#dots')){msum();$('#menu').classList.toggle('on');return}
  if(!e.target.closest('.hr'))$('#menu').classList.remove('on');
});
// প্রতি ২০ সেকেন্ডে ব্যালেন্স ও লাইভ ফিড নিজে আপডেট
setInterval(async function(){try{await load();if(page==='home')feed()}catch(e){}},20000);
load().then(function(){go('home')}).catch(function(e){V.innerHTML='<div class="card mut">'+esc(e.message)+'</div>'});
})();
</script>
