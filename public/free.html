 if(n==='rank')document.querySelectorAll('[data-rt]').forEach(function(b){b.onclick=function(){rt=b.dataset.rt;go('rank')}});
 if(n==='ref'){$('#cc').onclick=function(){copy(S.code)};$('#cl').onclick=function(){copy('https://earnhub.example/r/'+S.code)};
  $('#rs').onclick=function(){var nm=NM[S.refs.length%NM.length];S.refs.push(nm);add(CFG.refSignup);toast('নতুন বন্ধু! ৳'+CFG.refSignup+' বোনাস');go('ref')}}
 if(n==='pack')document.querySelectorAll('[data-pk]').forEach(function(b){b.onclick=function(){var i=+b.dataset.pk,p=CFG.pk[i];if(S.bal<p.pr){toast('ব্যালেন্স কম, আগে ডিপোজিট করুন');go('acc');return}S.bal-=p.pr;S.pk=i;persist();head();toast(p.n+' প্যাকেজ চালু হয়েছে');go('pack')}});
 if(n==='support')$('#ss').onclick=function(){toast('মেসেজ পাঠানো হয়েছে');$('#sm').value=''};
 if(n==='acc'){
  $('#pf').onchange=photoUp;document.querySelectorAll('[data-wt]').forEach(function(b){b.onclick=function(){wt=b.dataset.wt;go('acc')}});
  document.querySelectorAll('[data-pm]').forEach(function(b){b.onclick=function(){pm=b.dataset.pm;go('acc')}});
  document.querySelectorAll('[data-ap]').forEach(function(b){b.onclick=function(){S.deps.forEach(function(d){if(d.id==+b.dataset.ap&&d.st!=='Approved'){d.st='Approved';S.bal+=d.a}});persist();head();toast('ব্যালেন্স যোগ হয়েছে');go('acc')}});
  $('#wb').onclick=function(){var a=+$('#wa').value,x=$('#wx').value.trim(),e=$('#we');
   if(wt==='dep'){if(!(a>=50)){e.textContent='কমপক্ষে ৳৫০ দিন।';return}if(x.length<6){e.textContent='সঠিক Transaction ID দিন।';return}S.deps.push({id:Date.now(),a:a,m:pm,x:x,st:'Pending'});F.unshift(fitem('আপনি','ডিপোজিট',a));toast('ডিপোজিট রিকোয়েস্ট পাঠানো হয়েছে')}
   else{if(!/^01\d{9}$/.test(x)){e.textContent='সঠিক নাম্বার দিন (01XXXXXXXXX)।';return}if(!(a>=200)){e.textContent='কমপক্ষে ৳২০০ উইথড্র করা যাবে।';return}if(a>S.bal){e.textContent='ব্যালেন্সের বেশি উইথড্র করা যাবে না।';return}S.bal-=a;S.wd.push({id:Date.now(),a:a,m:pm,x:x,st:'Pending'});F.unshift(fitem('আপনি','উইথড্র',a));toast('উইথড্র রিকোয়েস্ট পাঠানো হয়েছে')}
   persist();head();go('acc')}}}
document.querySelectorAll('nav.tab [data-go],#menu [data-go]').forEach(function(b){b.onclick=function(){go(b.dataset.go)}});
$('#dots').onclick=function(){msum();$('#menu').classList.toggle('on')};
document.addEventListener('click',function(e){if(!e.target.closest('.hr'))$('#menu').classList.remove('on')});
head();go('home');msum();
})();
</script>
</body>
</html>
