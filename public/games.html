<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EarnHub – গেম টুর্নামেন্ট</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@600;800&display=swap">
<style>
:root{--bg:#0a0b1e;--bg2:#12143a;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--tx:#eef0ff;--mut:#9aa0cf;--cy:#2de2e6;--mg:#ff3d9a;--gd:#ffc93c;--ok:#4be38a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:radial-gradient(800px 460px at 85% -10%,#6e1a5a55,transparent),radial-gradient(600px 400px at -10% 40%,#0b5a7a33,transparent),var(--bg);color:var(--tx);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.55;min-height:100vh;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:Sora,"Hind Siliguri",sans-serif;margin:0}
.app{max-width:560px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.back{color:var(--tx);text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:600}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font:700 14px Sora,sans-serif;color:#ff6b8a}
.btn{border:0;cursor:pointer;font:600 16px "Hind Siliguri",sans-serif;color:#06112a;padding:12px 22px;border-radius:14px;background:linear-gradient(180deg,#6ff3f5,var(--cy));box-shadow:0 5px 0 #138a90,0 10px 20px #2de2e633;transition:transform .12s,box-shadow .12s;text-decoration:none;display:inline-block;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #138a90}
.btn.mg{color:#fff;background:linear-gradient(180deg,#ff72b8,var(--mg));box-shadow:0 5px 0 #a3185f}
.btn.ghost{background:var(--card);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:7px 16px;font-size:14px;border-radius:10px;box-shadow:0 3px 0 #138a90}
.btn.mg.sm{box-shadow:0 3px 0 #a3185f}
.btn[disabled]{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.full{width:100%;display:block}
:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mut{color:var(--mut);font-size:14px}
.tot{font:800 22px Sora,sans-serif;color:var(--cy)}
.price{color:var(--gd);font-weight:700}
h3.sec{font-size:18px;margin:20px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:#0003;border-radius:12px;padding:10px 4px;text-align:center}.mini b{display:block;font:800 20px Sora,sans-serif}.mini span{font-size:12px}
.gcard{display:flex;align-items:center;gap:12px}
.gi{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#6a2cc9,#c2268a);box-shadow:inset 0 -4px 0 #0004;flex:none}
.gcard>div:nth-child(2){flex:1;min-width:0}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:1;border-radius:14px;border:0;font-size:30px;background:#2a2d6e;color:#000;cursor:pointer;display:grid;place-items:center;padding:0}
.mc.f{background:#fff}.mc.m{background:#1a7a4a}
.qopt{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px;border-radius:14px;border:1px solid var(--line);background:#0a0c2e;color:var(--tx);font:600 16px "Hind Siliguri",sans-serif;cursor:pointer}
.qopt:active{background:#1c2060}
#cv{display:block;width:100%;max-width:340px;margin:0 auto;background:#0a0c2e;border:1px solid var(--line);border-radius:16px;touch-action:none}
.rk{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.rk .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 14px Sora,sans-serif;background:var(--card)}
.me{border:1px solid var(--cy);box-shadow:0 0 24px #2de2e633;background:linear-gradient(135deg,#0d3a5a,#16206a)}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#ff6b8a;color:#2a0510;padding:10px 20px;border-radius:99px;font-weight:600;display:none;z-index:30;text-align:center;max-width:90%}
</style>
</head>
<body>
<div class="app">
  <header><a class="back" href="/free">← ফিরে যান</a><div class="chip" id="cr">♦ 0</div></header>
  <main id="view"><div class="mut" style="text-align:center;padding:40px 0">লোড হচ্ছে...</div></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var V=$('#view'),INFO=null,tick=null,loopId=0,busy=false,tos=[],LEFT={};
var NM={memory:'🧠 মেমোরি ম্যাচ',quiz:'❓ কুইজ রাশ',coin:'🪙 কয়েন ক্যাচার',tap:'⚡ ট্যাপ রাশ'};
var DESC={memory:'১৬টা কার্ডে জোড়া মেলান। কম চাল ও কম সময়ে বেশি স্কোর।',quiz:'৮টা প্রশ্নের উত্তর দিন। ঠিক উত্তর ও গতিতে স্কোর।',coin:'৩০ সেকেন্ডে কয়েন ধরুন, বোমা এড়ান।',tap:'২০ সেকেন্ডে যত বেশি লক্ষ্যে ট্যাপ করুন।'};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fm(n){return Number(n||0).toFixed(2).replace(/\.?0+$/,'')}
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2800)}
async function api(p,b){
  var r=await fetch(p,{method:b!==undefined?'POST':'GET',headers:{'Content-Type':'application/json'},body:b!==undefined?JSON.stringify(b):undefined,credentials:'same-origin'});
  var d={};try{d=await r.json()}catch(e){}
  if(r.status===401){location.href='/';throw new Error('আবার লগইন করুন')}
  if(!r.ok||d.ok===false)throw new Error(d.msg||('সমস্যা হয়েছে ('+r.status+')'));
  return d;
}
function TO(t){tos.push(t);return t}
function stopGame(){clearInterval(tick);tick=null;cancelAnimationFrame(loopId);tos.forEach(clearTimeout);tos=[]}
function shell(title){
  V.innerHTML='<div class="card"><div class="row"><b>'+title+'</b><span class="mut" id="gt"></span></div><div id="gb" style="margin-top:12px"></div></div><button class="btn ghost full" id="gq">লবিতে ফিরুন (খেলা বাতিল)</button>';
  $('#gq').onclick=function(){if(confirm('খেলা ছেড়ে গেলে এই সুযোগটা শেষ হয়ে যাবে। ফিরবেন?'))lobby()};
}

/* ---------- লবি ---------- */
async function lobby(){
  stopGame();
  V.innerHTML='<div class="mut" style="text-align:center;padding:30px">লোড হচ্ছে...</div>';
  try{
    var me=await api('/api/me');
    if(me.user.site!=='free'){location.href='/smm';return}
    $('#cr').textContent='♦ '+fm(me.user.red);
    INFO=await api('/api/game/info');
    var left=Math.max(0,INFO.endsAt-Date.now()),dd=Math.floor(left/864e5),hh=Math.floor(left%864e5/36e5);
    var h='<div class="card"><h2 style="font-size:20px;margin-bottom:6px">🏆 সাপ্তাহিক টুর্নামেন্ট</h2><div class="mut">শেষ হতে বাকি: <b style="color:var(--gd)">'+dd+' দিন '+hh+' ঘণ্টা</b></div><div class="mut" style="margin-top:8px">পুরস্কার (রেড ডায়মন্ড): '+INFO.prizes.map(function(p,i){return (i+1)+'ম ♦'+p}).join(' · ')+'</div><div class="mut" style="margin-top:8px">এন্ট্রি সম্পূর্ণ ফ্রি, কোনো বাজি বা টাকা লাগে না, এটা দক্ষতার খেলা। প্রতি গেমে দিনে '+INFO.attempts+' বার খেলা যায়, সপ্তাহের সেরা স্কোর গোনা হয়। পুরস্কারের জন্য সপ্তাহে কমপক্ষে '+INFO.minPlays+' বার খেলতে হবে। সপ্তাহ শেষে সেরা ১০ জনের অ্যাকাউন্টে নিজে নিজে ডায়মন্ড যোগ হয়।</div></div><h3 class="sec" style="margin-top:6px">গেম বেছে নিন</h3>';
    INFO.games.forEach(function(g){
      LEFT[g.id]=g.left;
      h+='<div class="card"><div class="gcard"><div class="gi">'+g.icon+'</div><div><b>'+esc(g.name)+'</b><div class="mut">'+DESC[g.id]+'</div><div class="mut" style="margin-top:4px">আপনার সেরা: <b>'+g.best+'</b>'+(g.rank?' · র‍্যাংক #'+g.rank:'')+' · আজ বাকি '+g.left+' বার</div></div></div><div class="row" style="margin-top:12px"><button class="btn mg sm" data-play="'+g.id+'"'+(g.left>0?'':' disabled')+'>খেলুন</button><button class="btn ghost sm" data-board="'+g.id+'">লিডারবোর্ড</button></div></div>';
    });
    if(!INFO.games.length)h+='<div class="card mut">এখন কোনো গেম চালু নেই।</div>';
    V.innerHTML=h;
  }catch(e){V.innerHTML='<div class="card mut">'+esc(e.message)+'</div>'}
}
async function startGame(g){
  if(busy)return;busy=true;
  try{
    var S=await api('/api/game/start',{game:g});
    S.game=g;LEFT[g]=S.left;
    ({memory:gMemory,quiz:gQuiz,coin:gCoin,tap:gTap})[g](S);
  }catch(e){toast(e.message)}
  busy=false;
}
async function finish(S,body){
  stopGame();
  V.innerHTML='<div class="mut" style="text-align:center;padding:40px">স্কোর যাচাই হচ্ছে...</div>';
  body.token=S.token;
  try{var r=await api('/api/game/finish',body);result(r)}
  catch(e){V.innerHTML='<div class="card"><b>স্কোর গ্রহণ হয়নি</b><p class="mut">'+esc(e.message)+'</p></div><button class="btn full" id="bk">লবিতে ফিরুন</button>';$('#bk').onclick=lobby}
}
function result(r){
  var g=r.game;
  V.innerHTML='<div class="card" style="text-align:center"><div class="mut">'+NM[g]+'</div><div class="tot" style="font-size:46px;margin:6px 0">'+r.score+'</div><div class="mut">আপনার স্কোর</div><div class="grid" style="margin-top:12px"><div class="mini"><b>'+r.best+'</b><span class="mut">এই সপ্তাহের সেরা</span></div><div class="mini"><b>#'+r.rank+'</b><span class="mut">বর্তমান র‍্যাংক</span></div></div><div class="mut" style="margin-top:10px">এই সপ্তাহে খেলেছেন '+r.plays+' বার</div></div>'+
    (LEFT[g]>0?'<button class="btn mg full" data-play="'+g+'">আবার খেলুন ('+LEFT[g]+' বার বাকি)</button>':'<div class="card mut">আজকের সুযোগ শেষ, কাল আবার খেলুন।</div>')+
    '<button class="btn ghost full" data-board="'+g+'" style="margin-top:10px">লিডারবোর্ড দেখুন</button><button class="btn ghost full" id="bk" style="margin-top:10px">লবি</button>';
  $('#bk').onclick=lobby;
}
async function board(g){
  stopGame();
  V.innerHTML='<div class="mut" style="text-align:center;padding:30px">লোড হচ্ছে...</div>';
  try{
    var d=await api('/api/game/board?game='+g),h='<h3 class="sec" style="margin-top:0">'+NM[g]+' · এই সপ্তাহের সেরা</h3>';
    if(d.me)h+='<div class="card me"><div class="row"><div><div class="mut">আপনার র‍্যাংক</div><div class="tot">#'+d.me.rank+'</div></div><div style="text-align:right"><div class="mut">সেরা স্কোর</div><b class="price" style="font-size:20px">'+d.me.best+'</b></div></div></div>';
    h+='<div class="card">';
    if(!d.top.length)h+='<div class="mut">এখনো কেউ খেলেনি। প্রথম হওয়ার সুযোগ আপনার!</div>';
    d.top.forEach(function(r,i){h+='<div class="rk"'+(r.me?' style="color:var(--cy);font-weight:700"':'')+'><div class="n">'+(i+1)+'</div><div style="flex:1">'+esc(r.name)+(r.me?' (আপনি)':'')+'<div class="mut">'+r.plays+' বার খেলেছেন</div></div><span class="price">'+r.best+'</span></div>'});
    V.innerHTML=h+'</div><button class="btn ghost full" id="bk">লবি</button>';
    $('#bk').onclick=lobby;
  }catch(e){V.innerHTML='<div class="card mut">'+esc(e.message)+'</div>'}
}

/* ---------- মেমোরি ম্যাচ ---------- */
function gMemory(S){
  shell('🧠 মেমোরি ম্যাচ');
  var E=['🍎','🚗','⚽','🌙','🐟','🎈','🔔','🌸'],cards=S.cards,open=[],done={},moves=0,lock=false,t0=Date.now();
  var h='<div class="mut" style="margin-bottom:8px" id="mi">চাল: 0</div><div class="mgrid">';
  cards.forEach(function(c,i){h+='<button class="mc" data-i="'+i+'"></button>'});
  $('#gb').innerHTML=h+'</div>';
  tick=setInterval(function(){$('#gt').textContent=Math.floor((Date.now()-t0)/1000)+' সেকেন্ড'},500);
  var btns=document.querySelectorAll('.mc');
  btns.forEach(function(b){b.onclick=function(){
    var i=Number(b.dataset.i);
    if(lock||done[i]||open.indexOf(i)>=0)return;
    b.classList.add('f');b.textContent=E[cards[i]];open.push(i);
    if(open.length===2){
      moves++;$('#mi').textContent='চাল: '+moves;
      var a=open[0],c2=open[1];
      if(cards[a]===cards[c2]){
        done[a]=true;done[c2]=true;btns[a].classList.add('m');btns[c2].classList.add('m');open=[];
        if(Object.keys(done).length===16)finish(S,{moves:moves});
      }else{
        lock=true;
        TO(setTimeout(function(){btns[a].classList.remove('f');btns[c2].classList.remove('f');btns[a].textContent='';btns[c2].textContent='';open=[];lock=false},700));
      }
    }
  }});
}

/* ---------- কুইজ রাশ ---------- */
function gQuiz(S){
  shell('❓ কুইজ রাশ');
  var Q=S.questions,i=0,ans=[],t0=Date.now();
  tick=setInterval(function(){$('#gt').textContent=Math.floor((Date.now()-t0)/1000)+' সেকেন্ড'},500);
  function show(){
    var q=Q[i];
    $('#gb').innerHTML='<div class="mut">প্রশ্ন '+(i+1)+'/'+Q.length+'</div><h3 style="margin:8px 0 14px;line-height:1.4">'+esc(q.q)+'</h3>'+q.o.map(function(o,k){return '<button class="qopt" data-k="'+k+'">'+esc(o)+'</button>'}).join('');
    document.querySelectorAll('.qopt').forEach(function(b){b.onclick=function(){
      document.querySelectorAll('.qopt').forEach(function(x){x.disabled=true});
      ans.push(Number(b.dataset.k));i++;
      if(i<Q.length)show();else finish(S,{answers:ans});
    }});
  }
  show();
}

/* ---------- কয়েন ক্যাচার ---------- */
function gCoin(S){
  shell('🪙 কয়েন ক্যাচার');
  $('#gb').innerHTML='<canvas id="cv" width="300" height="400"></canvas><div class="mut" id="cs" style="text-align:center;margin-top:8px">ঝুড়ি সরাতে আঙুল টানুন</div>';
  var cv=$('#cv'),x=cv.getContext('2d'),W=300,H=400,bx=150,items=[],coins=0,bombs=0,last=performance.now(),spawn=0,t0=Date.now(),dur=S.secs*1000;
  function mv(e){
    var r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e;
    bx=Math.max(30,Math.min(W-30,(p.clientX-r.left)/r.width*W));
    if(e.cancelable)e.preventDefault();
  }
  cv.addEventListener('touchstart',mv,{passive:false});
  cv.addEventListener('touchmove',mv,{passive:false});
  cv.addEventListener('mousemove',mv);
  function loop(now){
    var dt=Math.min(50,now-last);last=now;
    var el=Date.now()-t0;
    if(el>=dur){finish(S,{coins:coins,bombs:bombs});return}
    spawn-=dt;
    if(spawn<=0){spawn=420+Math.random()*300;items.push({x:20+Math.random()*(W-40),y:-14,b:Math.random()<0.25,v:0.12+Math.random()*0.1})}
    x.clearRect(0,0,W,H);
    x.fillStyle='#ffc93c';x.fillRect(bx-30,H-26,60,14);
    x.font='22px sans-serif';x.textAlign='center';
    for(var k=items.length-1;k>=0;k--){
      var it=items[k];it.y+=it.v*dt;
      if(it.y>H-30&&it.y<H-8&&Math.abs(it.x-bx)<34){if(it.b)bombs++;else coins++;items.splice(k,1);continue}
      if(it.y>H+10){items.splice(k,1);continue}
      x.fillText(it.b?'💣':'🪙',it.x,it.y);
    }
    var cs=$('#cs'),gt=$('#gt');
    if(cs)cs.textContent='🪙 '+coins+'    💣 '+bombs;
    if(gt)gt.textContent=Math.max(0,Math.ceil((dur-el)/1000))+' সেকেন্ড';
    loopId=requestAnimationFrame(loop);
  }
  loopId=requestAnimationFrame(loop);
}

/* ---------- ট্যাপ রাশ ---------- */
function gTap(S){
  shell('⚡ ট্যাপ রাশ');
  $('#gb').innerHTML='<div id="ta" style="position:relative;height:340px;background:#0a0c2e;border:1px solid var(--line);border-radius:16px;overflow:hidden;touch-action:manipulation"></div><div class="mut" id="ts" style="text-align:center;margin-top:8px"></div>';
  var ta=$('#ta'),hits=0,misses=0,t0=Date.now(),dur=S.secs*1000,curT=null;
  function spawn(){
    if(curT){curT.remove();curT=null}
    if(Date.now()-t0>=dur)return;
    var d=document.createElement('button');
    d.textContent='⚡';
    d.style.cssText='position:absolute;width:58px;height:58px;border-radius:50%;border:0;font-size:26px;cursor:pointer;background:linear-gradient(135deg,#ff72b8,#ff3d9a);left:'+Math.floor(Math.random()*(ta.clientWidth-58))+'px;top:'+Math.floor(Math.random()*(ta.clientHeight-58))+'px';
    d.onclick=function(ev){ev.stopPropagation();hits++;d.remove();curT=null;TO(setTimeout(spawn,120))};
    ta.appendChild(d);curT=d;
    TO(setTimeout(function(){if(curT===d){d.remove();curT=null;spawn()}},900));
  }
  ta.onclick=function(){misses++};
  spawn();
  tick=setInterval(function(){
    var el=Date.now()-t0;
    var gt=$('#gt'),ts=$('#ts');
    if(gt)gt.textContent=Math.max(0,Math.ceil((dur-el)/1000))+' সেকেন্ড';
    if(ts)ts.textContent='✅ '+hits+'    ❌ '+misses;
    if(el>=dur)finish(S,{hits:hits,misses:misses});
  },200);
}

document.addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-play]'))){startGame(t.dataset.play);return}
  if((t=e.target.closest('[data-board]'))){board(t.dataset.board);return}
});
lobby();
})();
</script>
</body>
  </html>
